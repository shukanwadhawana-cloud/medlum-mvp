name: MedLum Desktop Packaging

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "MedLum HTTPS URL for the desktop window (optional if repository variable MEDLUM_APP_URL is set)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/verify-desktop-packaging.mjs"
      - "scripts/prepare-desktop-web.mjs"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "src/app/**"
      - "src/components/**"
      - ".github/workflows/desktop-packaging.yml"

permissions:
  contents: read

env:
  # Prefer dispatch input when provided; otherwise repository Variable. Never hardcode production URL.
  MEDLUM_APP_URL: ${{ github.event.inputs.app_url || vars.MEDLUM_APP_URL }}

jobs:
  verify:
    name: Verify desktop packaging configuration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Repo does not commit package-lock.json; match MedLum CI install style.
      - run: npm install --include=dev --ignore-scripts
      - run: npm run test:desktop-packaging

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Build web frontend
        run: npm run build:desktop-web

      - name: Resolve MEDLUM_APP_URL
        id: app_url
        shell: bash
        run: |
          if [ -z "$MEDLUM_APP_URL" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "MEDLUM_APP_URL is required for manual desktop packaging."
              echo "Provide the app_url workflow input, or set repository variable MEDLUM_APP_URL (Actions → Variables)."
              exit 1
            fi
            echo "MEDLUM_APP_URL is not set — skipping native Tauri build on this push."
            echo "Set repository variable MEDLUM_APP_URL (Actions → Variables) to the deployed HTTPS URL to produce installers."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            if ! [[ "$MEDLUM_APP_URL" =~ ^https:// ]]; then
              echo "MEDLUM_APP_URL must use HTTPS (got: $MEDLUM_APP_URL)"
              exit 1
            fi
            echo "Using MEDLUM_APP_URL for desktop window."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.app_url.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && steps.app_url.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Configure deployed MedLum URL
        if: steps.app_url.outputs.skip != 'true'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const url = process.env.MEDLUM_APP_URL;
          if (!/^https:\/\//.test(url)) throw new Error('MEDLUM_APP_URL must use HTTPS');
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          config.app.windows[0].url = url;
          fs.writeFileSync('src-tauri/tauri.conf.generated.json', JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build Tauri bundle
        if: steps.app_url.outputs.skip != 'true'
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: .
          args: --config src-tauri/tauri.conf.generated.json

      - name: Upload desktop installers
        if: steps.app_url.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: medlum-${{ runner.os }}-desktop
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error
          retention-days: 14
