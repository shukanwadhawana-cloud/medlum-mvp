[package]
name = "medlum"
version = "0.2.1"
description = "MedLum clinical operations platform"
authors = ["MedLum"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "medlum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
