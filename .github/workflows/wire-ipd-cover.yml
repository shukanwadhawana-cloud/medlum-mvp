name: wire-ipd-cover
on:
  workflow_dispatch:
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire component into IPD page
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/app/ipd/[id]/page.tsx")
          t = p.read_text()
          if "IpdCoverSheet" not in t:
              if 'from "@/components/AppShell"' in t:
                  t = t.replace(
                      'from "@/components/AppShell"',
                      'from "@/components/AppShell";\nimport IpdCoverSheet from "@/components/IpdCoverSheet"',
                      1,
                  )
              elif "from '@/components/AppShell'" in t:
                  t = t.replace(
                      "from '@/components/AppShell'",
                      "from '@/components/AppShell';\nimport IpdCoverSheet from '@/components/IpdCoverSheet'",
                      1,
                  )
              else:
                  t = t.replace('"use client";', '"use client";\nimport IpdCoverSheet from "@/components/IpdCoverSheet";', 1)

          if "<IpdCoverSheet" in t:
              print("already wired")
          else:
              start = t.find("{/* COVER SHEET")
              if start < 0:
                  start = t.find('mainTab==="Cover Sheet"&&')
              if start < 0:
                  raise SystemExit("cover sheet marker missing")
              end = t.find("{/* DASHBOARD", start)
              if end < 0:
                  end = t.find('mainTab==="Dashboard"&&leftNav==="Vitals"', start)
              if end < 0:
                  raise SystemExit("dashboard marker missing")
              block_start = t.rfind("\n", 0, start) + 1
              replacement = '''    {/* COVER SHEET — OPD-parity */}
    {mainTab==="Cover Sheet"&&(
     <IpdCoverSheet
      selected={selected}
      vitals={vitals}
      labOrders={labOrders}
      radOrders={radOrders}
      clinicalNotes={clinicalNotes}
      onOpenOrders={(left)=>{setMainTab("Orders");setLeftNav(left)}}
      onOpenNotes={()=>{setMainTab("Clinical Notes");setLeftNav("Note View")}}
      onOpenVitals={()=>{setMainTab("Dashboard");setLeftNav("Vitals")}}
     />
    )}

'''
              t = t[:block_start] + replacement + t[end:]
              print("wired cover sheet component")

          # Enrich pre-workspace landing if still compact max-w-3xl card
          if 'max-w-3xl bg-white rounded-xl border shadow-sm p-4' in t and 'Open Clinical Workspace' in t:
              # Soft visual upgrade: widen and add subtle structure via class swaps only
              t = t.replace('max-w-3xl bg-white rounded-xl border shadow-sm p-4', 'max-w-5xl bg-white rounded-xl border shadow-sm p-4')
              print("landing widened")

          p.write_text(t)
          assert "IpdCoverSheet" in t
          print("ok")
          PY
      - name: Commit
        run: |
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add "src/app/ipd/[id]/page.tsx"
          git commit -m "ui(ipd): wire OPD-parity cover sheet into clinical workspace" || exit 0
          git push origin HEAD:main
