name: MedLum Production Pilot Validation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["MedLum CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  production-pilot:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for production to serve the validated commit
        env:
          PILOT_BASE_URL: https://medlumhealth.com
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Expected commit SHA is missing or malformed."
            exit 1
          fi

          for attempt in $(seq 1 12); do
            echo "Production health/SHA verification attempt ${attempt}/12"
            body="$(curl -fsS --max-time 15 "$PILOT_BASE_URL/api/health" || true)"
            if [ -n "$body" ]; then
              deployed_sha="$(printf '%s' "$body" | node -e '
                let s = "";
                process.stdin.on("data", d => s += d);
                process.stdin.on("end", () => {
                  try { console.log(String(JSON.parse(s).gitSha || "").toLowerCase()); }
                  catch { console.log(""); }
                });
              ')"

              if [ "$deployed_sha" = "${EXPECTED_SHA,,}" ] || { [ "${#deployed_sha}" -eq 7 ] && [ "$deployed_sha" = "${EXPECTED_SHA:0:7}" ]; }; then
                echo "Production health endpoint serves expected commit ${EXPECTED_SHA:0:7}."
                exit 0
              fi
              echo "Health endpoint responded, but SHA is ${deployed_sha:-missing}; waiting for ${EXPECTED_SHA:0:7}."
            fi
            sleep 30
          done

          echo "::error::Production did not become healthy and serve the validated commit within 6 minutes."
          exit 1

      - name: Verify production pilot smoke
        env:
          PILOT_BASE_URL: https://medlumhealth.com
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/verify-production-pilot.mjs
