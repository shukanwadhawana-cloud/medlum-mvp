name: land-opd-print-btn
on:
  workflow_dispatch:
jobs:
  land:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Insert Print OPD Record button
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/app/patients/[id]/page.tsx")
          t = p.read_text()
          if "Print OPD Record" in t:
              print("already present")
              raise SystemExit(0)
          needle = '''            <button type="button" onClick={() => setShowFollowUp(true)} className="h-9 px-3 rounded-lg border text-xs font-medium">Follow-up</button>
            <Link href="/patients" className="h-9 px-3 rounded-lg border text-xs font-medium inline-flex items-center">Back</Link>'''
          insert = '''            <button type="button" onClick={() => setShowFollowUp(true)} className="h-9 px-3 rounded-lg border text-xs font-medium">Follow-up</button>
            <Link href={`/patients/${id}/print`} className="h-9 px-3 rounded-lg border border-[#c2183a]/30 bg-[#c2183a]/5 text-[#c2183a] text-xs font-medium inline-flex items-center print:hidden">Print OPD Record</Link>
            <Link href="/patients" className="h-9 px-3 rounded-lg border text-xs font-medium inline-flex items-center">Back</Link>'''
          if needle not in t:
              raise SystemExit("needle not found")
          p.write_text(t.replace(needle, insert, 1))
          print("patched")
          PY
      - name: Commit
        run: |
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add "src/app/patients/[id]/page.tsx"
          git commit -m "feat(opd): Print OPD Record button on patient workspace" || exit 0
          git push origin HEAD:main
