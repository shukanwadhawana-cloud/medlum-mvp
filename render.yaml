services:
  - type: web
    name: medlum-ocr
    runtime: docker
    dockerfilePath: ./services/ocr/Dockerfile
    dockerContext: ./services/ocr
    plan: standard
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: OCR_SERVICE_SECRET
        generateValue: true
      - key: OCR_MAX_BYTES
        value: "10485760"
      - key: OCR_MAX_PAGES
        value: "20"
