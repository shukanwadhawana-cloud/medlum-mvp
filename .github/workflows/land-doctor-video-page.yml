name: land-doctor-video-page
on:
  workflow_dispatch:
jobs:
  land:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch openVideoWithMic for Safari
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/app/telemedicine/[id]/page.tsx")
          t = p.read_text()
          if "openConferenceInNewTab" not in t:
              t = t.replace(
                  'import AppShell from "@/components/AppShell";',
                  'import AppShell from "@/components/AppShell";\nimport { openConferenceInNewTab, warmConferenceOrigin } from "@/lib/telemedicine-client";',
              )
          # Replace broken async openVideoWithMic if still present
          import re
          pattern = r"async function openVideoWithMic\(\) \{[\s\S]*?\n  \}"
          new_fn = '''function openVideoWithMic() {
    setError("");
    setPermHint("");
    const url = session?.meetingUrl;
    if (!url) {
      setError("Video room is not ready yet. Start the call for the guest first, then try again.");
      return;
    }
    openConferenceInNewTab(url);
    void requestCameraMic()
      .then(() => {
        setMsg("Video opened in a new tab. Allow microphone/camera if asked, then join the MiroTalk room.");
      })
      .catch(() => {
        setPermHint(
          "Allow Microphone when the browser asks. Settings → Safari → Microphone → Allow for this website. Then use the mic control inside the video room."
        );
      });
  }'''
          if re.search(pattern, t):
              t = re.sub(pattern, new_fn, t, count=1)
              print("replaced async openVideoWithMic")
          elif "function openVideoWithMic()" in t and "openConferenceInNewTab" in t:
              print("already patched")
          else:
              # try simpler replace of window.open meetingUrl line
              if "window.open(session.meetingUrl" in t:
                  t = t.replace(
                      "window.open(session.meetingUrl, \"_blank\", \"noopener,noreferrer\");",
                      "openConferenceInNewTab(session.meetingUrl);",
                  )
                  print("replaced window.open")
              else:
                  raise SystemExit("could not patch openVideoWithMic")
          if "warmConferenceOrigin(session.meetingUrl)" not in t:
              needle = "  }, [params]);"
              insert = '''  }, [params]);

  useEffect(() => {
    if (session?.meetingUrl) warmConferenceOrigin(session.meetingUrl);
  }, [session?.meetingUrl]);'''
              if needle in t:
                  t = t.replace(needle, insert, 1)
          t = t.replace("Join with mic (new tab)", "Join video (new tab)")
          t = t.replace("onClick={() => void openVideoWithMic()}", "onClick={() => openVideoWithMic()}")
          p.write_text(t)
          print("ok")
          PY
      - name: Commit
        run: |
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add "src/app/telemedicine/[id]/page.tsx"
          git commit -m "fix(telemedicine): clinician Safari-safe MiroTalk new-tab join" || exit 0
          git push origin HEAD:main
