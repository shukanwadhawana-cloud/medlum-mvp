name: MedLum Vercel Production Deploy

on:
  workflow_run:
    workflows: ["MedLum CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: medlum-production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require green CI for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GH_REPOSITORY/commits/main" --jq .sha)"
          if [ "$MAIN_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refusing stale deployment: main is $MAIN_SHA but this run targets $EXPECTED_SHA."
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$CI_CONCLUSION" != "success" ]; then
              echo "Refusing production deployment because MedLum CI did not pass."
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$EXPECTED_SHA&per_page=20" \
              | node -e '
                let s = "";
                process.stdin.on("data", d => s += d);
                process.stdin.on("end", () => {
                  const data = JSON.parse(s);
                  const ok = (data.workflow_runs || []).some(r => r.head_sha === process.env.EXPECTED_SHA && r.status === "completed" && r.conclusion === "success");
                  if (!ok) {
                    console.error("No successful MedLum CI run found for exact SHA " + process.env.EXPECTED_SHA);
                    process.exit(1);
                  }
                  console.log("Green MedLum CI confirmed for " + process.env.EXPECTED_SHA);
                });
              '
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confirm native Vercel Git deployment or deploy exact green commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          HEALTH_URL: https://medlumhealth.com/api/health
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Public project identifiers; only the Vercel access token belongs in GitHub Secrets.
          VERCEL_ORG_ID: team_dU4dKrRORHc1lsVEv9jFCg4m
          VERCEL_PROJECT_ID: prj_d2yfp86FdBAYSN3wFfFz4aL4iuRq
        run: |
          set -euo pipefail
          # Vercel's connected Git integration deploys main automatically. Accept it only
          # when the canonical production health endpoint proves the exact green SHA.
          for i in $(seq 1 32); do
            BODY="$(curl -fsS --max-time 20 "$HEALTH_URL" || true)"
            DEPLOYED_SHA="$(printf '%s' "$BODY" | node -e '
              let s = "";
              process.stdin.on("data", d => s += d);
              process.stdin.on("end", () => {
                try { console.log(JSON.parse(s).gitSha || ""); }
                catch { console.log(""); }
              });
            ')"
            if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
              echo "Canonical production host is serving the exact green commit ($DEPLOYED_SHA); no duplicate CLI deployment needed."
              exit 0
            fi
            echo "Waiting for native Git deployment of $EXPECTED_SHA (currently ${DEPLOYED_SHA:-none}) attempt $i/32."
            sleep 15
          done
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Canonical production did not serve the exact green SHA and VERCEL_TOKEN is not configured. Native deployment cannot be verified; refusing an unverified release."
            exit 1
          fi
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --scope doc-shukan
      - name: Verify production serves exact Git SHA
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          URL="https://medlumhealth.com/api/health"
          # Up to ~8 minutes for Vercel build + promote after a green CI
          for i in $(seq 1 32); do
            BODY="$(curl -fsS --max-time 20 "$URL" || true)"
            DEPLOYED_SHA="$(printf '%s' "$BODY" | node -e '
              let s="";
              process.stdin.on("data",d=>s+=d);
              process.stdin.on("end",()=>{try{console.log(JSON.parse(s).gitSha||"")}catch{console.log("")}})
            ')"
            if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
              echo "Vercel production is serving the triggering commit ($DEPLOYED_SHA)."
              exit 0
            fi
            echo "Waiting for Vercel production to serve $EXPECTED_SHA (currently ${DEPLOYED_SHA:-none}) attempt $i/32."
            sleep 15
          done
          echo "Vercel production did not expose the expected Git SHA after waiting."
          echo "Check Vercel project → Deployments for failed builds, and ensure Git integration is linked to main."
          exit 1
