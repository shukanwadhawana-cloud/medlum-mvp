name: land-staff-login-ui
on:
  workflow_dispatch:
jobs:
  land:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch login page and api
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          # api.ts
          api = Path("src/lib/api.ts")
          at = api.read_text()
          at2 = at.replace(
              'export async function apiLogin(email: string, password: string) { const res = await fetch("/api/auth/login", { ...opts, method: "POST", body: JSON.stringify({ email, password }) });',
              'export async function apiLogin(staffId: string, password: string) { const res = await fetch("/api/auth/login", { ...opts, method: "POST", body: JSON.stringify({ staffId, password }) });',
          )
          if at2 == at:
              print("api already patched or pattern missing")
          else:
              api.write_text(at2)
              print("api patched")

          # login page
          p = Path("src/app/login/page.tsx")
          t = p.read_text()
          t = t.replace('const [email, setEmail] = useState("");', 'const [staffId, setStaffId] = useState("");')
          t = t.replace("apiLogin(email, password)", "apiLogin(staffId, password)")
          t = t.replace('"Invalid email or password"', '"Invalid Staff Login ID or password"')
          t = t.replace(
              '''    const emailValue = email.trim();
    const passwordValue = password;
    if (!emailValue || !passwordValue) {
      setError("Enter email and password, then connect Telegram.");
      return;
    }''',
              '''    const staffIdValue = staffId.trim();
    const passwordValue = password;
    if (!staffIdValue || !passwordValue) {
      setError("Enter Staff Login ID and password, then connect Telegram.");
      return;
    }''',
          )
          t = t.replace(
              "body: JSON.stringify({ email: emailValue, password: passwordValue })",
              "body: JSON.stringify({ staffId: staffIdValue, password: passwordValue })",
          )
          old_email_field = '''              <div>
                <label className="block text-sm font-medium mb-1.5">Email</label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full h-12 px-4 rounded-xl border border-gray-200"
                  placeholder="you@clinic.com"
                  autoComplete="email"
                />
              </div>'''
          new_staff_field = '''              <div>
                <label className="block text-sm font-medium mb-1.5">MedLum Staff ID</label>
                <input
                  type="text"
                  required
                  value={staffId}
                  onChange={(e) => setStaffId(e.target.value.toUpperCase())}
                  className="w-full h-12 px-4 rounded-xl border border-gray-200 font-mono tracking-wide"
                  placeholder="CL01038020"
                  autoComplete="username"
                  autoCapitalize="characters"
                  spellCheck={false}
                />
                <p className="mt-1 text-[11px] text-gray-400">Use the Staff Login ID issued by your hospital (not email).</p>
              </div>'''
          if old_email_field in t:
              t = t.replace(old_email_field, new_staff_field, 1)
              print("login field replaced")
          elif "MedLum Staff ID" in t:
              print("login field already")
          else:
              raise SystemExit("email field not found")

          # clinic page labels
          cp = Path("src/app/clinic/page.tsx")
          ct = cp.read_text()
          ct = ct.replace('placeholder="Email / login"', 'placeholder="Email (contact / recovery — not login)"')
          ct = ct.replace(
              "Staff account created (${j.member?.staffCode||\"\"}). Telegram linking is ready below.",
              "Staff Login ID: ${j.member?.staffCode||\"\"}. Share this ID for login. Telegram linking is ready below.",
          )
          ct = ct.replace(
              "Staff account created (${j.member.staffCode}).",
              "Staff Login ID: ${j.member.staffCode}. Use this ID to log in.",
          )
          cp.write_text(ct)
          p.write_text(t)
          print("done")
          PY
      - name: Commit
        run: |
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add src/app/login/page.tsx src/lib/api.ts src/app/clinic/page.tsx
          git commit -m "feat(auth): Staff ID login UI and apiLogin client" || exit 0
          git push origin HEAD:main
