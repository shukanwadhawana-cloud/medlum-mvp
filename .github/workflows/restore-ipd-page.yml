name: Restore IPD page from known-good
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Historical IPD page restore (manual only)
        run: |
          echo "This one-shot workflow is retained for history and manual dispatch only."
          echo "It no longer runs on push. Use only if IPD page is corrupted and a known-good SHA is confirmed."
