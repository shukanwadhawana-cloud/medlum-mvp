name: Fix IPD Placeholder
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore IPD page from known-good commit
        run: |
          git show b6292fd:src/app/ipd/\[id\]/page.tsx > "src/app/ipd/[id]/page.tsx"
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/app/ipd/[id]/page.tsx")
          text = p.read_text()
          print("restored size", len(text))
          if "PLACEHOLDER" in text or "RESTORING" in text or len(text) < 1000:
              raise SystemExit("restore failed")
          assert "clinicalMode" in text and "IpdCoverSheet" in text
          print("restore OK")
          PY
      - name: Commit
        run: |
          git config user.name "medlum-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "src/app/ipd/[id]/page.tsx"
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "fix(ipd): restore page.tsx from b6292fd after placeholder corruption"
          git push origin HEAD:main
