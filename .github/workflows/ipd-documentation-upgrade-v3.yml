name: IPD Documentation Upgrade v3
on:
  push:
    branches: [fix/ipd-live-clinical-workflow]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/app/ipd/page.tsx')
          s=p.read_text()
          if 'IPD Documentation Timeline' in s:
              print('Already upgraded')
          else:
              # Add structured state without depending on exact formatting.
              pat=r'(const\[vitals,setVitals\]=useState\(\{bp:"",pulse:"",rr:"",spo2:"",temperature:""\}\);)'
              repl=r'\1const[structured,setStructured]=useState({dateTime:new Date().toISOString().slice(0,16),diagnosis:"",hpi:"",allergy:"",examTime:"",cns:"",cvs:"",rs:"",perAbdomen:"",assessment:"",workingDiagnosis:"",treatmentGiven:"",course:"",procedures:"",investigations:"",dischargeTreatment:"",followUpDate:""});'
              s,n=re.subn(pat,repl,s,count=1)
              if n!=1: raise SystemExit('vitals state not found')
              # Add structured save handler before existing post helper.
              marker=' const post=async(body:any)=>'
              handler=''' const saveStructured=async(e:React.FormEvent)=>{e.preventDefault();if(!selected)return;const x=structured;const content=`Date & time: ${x.dateTime}\\nDiagnosis: ${x.diagnosis}\\nHistory of present illness: ${x.hpi}\\nAllergy: ${x.allergy}\\nExamination time: ${x.examTime}\\nVitals: BP ${vitals.bp} | Pulse ${vitals.pulse} | RR ${vitals.rr} | SpO₂ ${vitals.spo2} | Temperature ${vitals.temperature}\\nAssessment — CNS: ${x.cns}\\nAssessment — CVS: ${x.cvs}\\nAssessment — Respiratory system: ${x.rs}\\nAssessment — Per abdomen: ${x.perAbdomen}\\nAssessment / findings: ${x.assessment}\\nWorking diagnosis: ${x.workingDiagnosis}\\nTreatment given: ${x.treatmentGiven}\\nCourse during admission: ${x.course}\\nProcedures performed: ${x.procedures}\\nInvestigations advised / results: ${x.investigations}\\nTreatment on discharge: ${x.dischargeTreatment}\\nFollow-up date: ${x.followUpDate}`;if(!(await run({action:"clinical-note",patientId:selected.id,noteType:note.noteType,content,authorRole:`${doctor?.name||"Logged-in clinician"} · ${note.noteType}`},`${note.noteType} saved to IPD history`)))return;setStructured({...structured,dateTime:new Date().toISOString().slice(0,16)})};\\n'''
              if marker not in s: raise SystemExit('post marker not found')
              s=s.replace(marker,handler+marker,1)
              # Insert a structured form and timeline immediately before the register modal.
              marker=' {showRegister&&'
              block=''' <div className="mt-3 border rounded-xl p-3"><div className="flex items-center justify-between gap-2"><div><h4 className="font-semibold text-sm">Structured clinical documentation</h4><p className="text-[10px] text-gray-500">Predetermined clinical format. Nursing assessment includes observed findings, not just vitals.</p></div><span className="text-[10px] text-gray-500">Date → diagnosis → HPI → allergy → exam/vitals → CNS/CVS/RS/P/A → assessment → working Dx → treatment → course → procedures → investigations → discharge treatment → follow-up</span></div><form onSubmit={saveStructured} className="mt-3 grid md:grid-cols-3 gap-2"><label className="text-xs font-medium">Date & time<input required type="datetime-local" value={structured.dateTime} onChange={e=>setStructured({...structured,dateTime:e.target.value})} className="mt-1 w-full h-9 px-2 rounded-lg border text-xs"/></label><label className="text-xs font-medium">Diagnosis<input value={structured.diagnosis} onChange={e=>setStructured({...structured,diagnosis:e.target.value})} className="mt-1 w-full h-9 px-2 rounded-lg border text-xs"/></label><label className="text-xs font-medium">Allergy<input value={structured.allergy||selected.allergies||""} onChange={e=>setStructured({...structured,allergy:e.target.value})} className="mt-1 w-full h-9 px-2 rounded-lg border text-xs"/></label><label className="text-xs font-medium md:col-span-2">History of present illness<textarea value={structured.hpi} onChange={e=>setStructured({...structured,hpi:e.target.value})} className="mt-1 w-full min-h-16 px-2 py-2 rounded-lg border text-xs"/></label><label className="text-xs font-medium">Examination time<input value={structured.examTime} onChange={e=>setStructured({...structured,examTime:e.target.value})} className="mt-1 w-full h-9 px-2 rounded-lg border text-xs"/></label><div className="border rounded-lg p-2 md:col-span-3"><p className="text-xs font-semibold mb-2">Vitals during examination</p><div className="grid grid-cols-2 md:grid-cols-5 gap-2">{[["bp","BP"],["pulse","Pulse"],["rr","RR"],["spo2","SpO₂"],["temperature","Temperature"]].map(([k,l])=><label key={k} className="text-[10px] font-medium">{l}<input value={(vitals as any)[k]} onChange={e=>setVitals({...vitals,[k]:e.target.value})} className="mt-1 w-full h-8 px-2 rounded-lg border text-xs"/></label>)}</div></div>{[["cns","CNS assessment"],["cvs","CVS assessment"],["rs","Respiratory system assessment"],["perAbdomen","Per abdomen assessment"],["assessment","Assessment / findings — record what was actually observed"],["workingDiagnosis","Working diagnosis"],["treatmentGiven","Treatment given"],["course","Course during hospital admission"],["procedures","Procedures performed"],["investigations","Investigations advised / results"],["dischargeTreatment","Treatment on discharge"]].map(([k,l])=><label key={k} className="text-xs font-medium">{l}<textarea value={(structured as any)[k]} onChange={e=>setStructured({...structured,[k]:e.target.value})} className="mt-1 w-full min-h-16 px-2 py-2 rounded-lg border text-xs"/></label>)}<label className="text-xs font-medium">Follow-up date<input type="date" value={structured.followUpDate} onChange={e=>setStructured({...structured,followUpDate:e.target.value})} className="mt-1 w-full h-9 px-2 rounded-lg border text-xs"/></label><div className="md:col-span-3"><button disabled={saving} className="h-9 px-3 rounded-lg bg-[#c2183a] text-white text-xs">{saving?"Saving…":"Save Structured Documentation"}</button></div></form></div><div className="mt-3 border rounded-xl p-3"><div className="flex items-center justify-between"><h4 className="font-semibold text-sm">IPD Documentation Timeline</h4><span className="text-[10px] text-gray-500">Date/time · type · clinician · content</span></div><div className="mt-2 space-y-2">{selected.clinicalNotes?.length?selected.clinicalNotes.map((n:any,i:number)=><article key={`${n.id}-${i}`} className="border rounded-lg p-3"><div className="flex flex-wrap justify-between gap-2"><div><span className="font-semibold text-xs">{n.noteType||"Clinical Note"}</span><span className="ml-2 text-[10px] text-gray-500">{n.authorRole||"Clinician"}</span></div><time className="text-[10px] text-gray-500">{n.createdAt?new Date(n.createdAt).toLocaleString():"—"}</time></div><pre className="mt-2 whitespace-pre-wrap font-sans text-xs text-gray-700">{n.content||"—"}</pre></article>):<p className="text-xs text-gray-500 py-3">No documentation recorded yet.</p>}</div></div><div className="mt-3 flex gap-2"><Link href="/ipd-summaries" className="h-9 px-3 rounded-lg border text-xs inline-flex items-center">Hospital Summaries</Link></div>\n'''
              if marker not in s: raise SystemExit('register marker not found')
              s=s.replace(marker,block+marker,1)
              p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'IPD Documentation Timeline' src/app/ipd/page.tsx
          grep -q 'Structured clinical documentation' src/app/ipd/page.tsx
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/ipd/page.tsx
          git rm -f .github/workflows/ipd-documentation-upgrade.yml .github/workflows/ipd-documentation-upgrade-v2.yml .github/workflows/ipd-documentation-upgrade-v3.yml IPD-DOC-UPGRADE-TRIGGER.md || true
          git diff --cached --check
          git commit -m 'feat(ipd): add structured clinical documentation timeline [skip ci]'
          git push origin HEAD:fix/ipd-live-clinical-workflow
