name: MedLum CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --include=dev --ignore-scripts; else npm install --include=dev --ignore-scripts; fi
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
        run: npx prisma generate
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Verify production security
        run: npm run test:production-security
      - name: Verify OWASP ASVS 5.0 hardening baseline
        run: npm run test:asvs-hardening
      - name: Verify CSRF and CSP hardening
        run: npm run test:csrf
      - name: Verify pilot readiness
        run: npm run test:pilot-readiness
      - name: Verify OPD and IPD pilot UI
        run: npm run test:ipd-pilot-ui
      - name: Verify EKA ABDM onboarding
        run: npm run test:eka
      - name: Verify MedLum data architecture
        run: npm run test:data-architecture
      - name: Verify data retention protections
        run: npm run test:data-retention
      - name: Verify soft deactivation protections
        run: npm run test:soft-deactivation
      - name: Verify disaster-recovery readiness
        run: npm run test:disaster-recovery-readiness
      - name: Verify Phase B legacy clinicId correction
        run: npm run test:phase-b-legacy-clinicid
      - name: Verify API authentication coverage
        run: npm run test:api-auth-coverage
      - name: Verify telemedicine foundation
        run: npm run test:telemedicine
      - name: Verify video consultation layer
        run: npm run test:video-consultation
      - name: Verify responsive UI and PWA hardening
        run: npm run test:responsive-ui
      - name: Verify Android and iOS packaging configuration
        run: npm run test:mobile-packaging
      - name: Verify Windows macOS Linux packaging configuration
        run: npm run test:desktop-packaging
      - name: Verify multi-device and role workflows
        run: npm run test:multi-device-role-workflow
      - name: Verify hospital foundation (OTP tariff lab lifecycle)
        run: npm run test:hospital-foundation
      - name: Verify invoice tariff snapshot + numbering
        run: npm run test:invoice-snapshot
      - name: Verify patient portal auth and dashboard
        run: npm run test:portal-auth
      - name: Verify privileged staff OTP login invariants
        run: npm run test:otp-login-invariant
      - name: Verify Telegram OTP security and linking
        run: npm run test:telegram-otp
      - name: Verify secure password reset and staff recovery
        run: npm run test:password-reset
      - name: Verify lab document extraction and retry safety
        run: npm run test:document-intelligence
      - name: Verify multi-tenant isolation (static)
        run: npm run test:tenant-isolation
      - name: Verify P1 closure (static)
        run: npm run test:p1-closure
      - name: Verify staff and workforce management
        run: npm run test:staff-workforce
      - name: Verify duty and attendance management
        run: npm run test:duty
      - name: Verify role-aware staff access and navigation
        run: npm run test:role-access
      - name: Verify P1 identity and tenant security regressions
        run: npm run test:p1-security-regression
      - name: Facility data migration security
        run: npm run test:facility-data-migration
      - name: Verify patient discovery facility scope
        run: npm run test:patient-discovery
      - name: Verify server-side workflow permissions
        run: npm run test:workflow-permissions
      - name: Verify P2-01 IPD discharge lifecycle
        run: npm run test:p2-01
      - name: Verify owner full-access entitlement
        run: npm run test:owner-full-access
      - name: Verify P2-02 IPD bed lifecycle
        run: npm run test:p2-02
      - name: Verify P2-03 IPD investigation review
        run: npm run test:p2-03
      - name: Verify P2-04 Emergency to IPD admission continuity
        run: npm run test:p2-04
      - name: Verify OPD admission bed categories and OCR regression safeguards
        run: npm run test:admission-bed-categories && npm run test:clinical-assist-ocr
      - name: Verify P2-05 IPD receiving-team handover
        run: npm run test:p2-05
      - name: Verify P2-06 IPD medication dispensing reconciliation
        run: npm run test:p2-06
      - name: Verify P2-07 MAR
        run: npm run test:p2-07
      - name: Verify issue 100 clinical workflows
        run: npm run test:issue-100
      - name: Verify IPD failed-save handling
        run: npm run test:ipd-save-error-handling
      - name: Verify clinical double-verification and final signing
        run: npm run test:clinical-signing
      - name: Verify record confirmation and cancellation lifecycle
        run: npm run test:record-confirmation
      - name: Verify OPD clinical record workflow
        run: npm run test:opd-clinical-record
      - name: Verify IPD clinical workflow
        run: npm run test:ipd-clinical-workflow
      - name: Verify RBAC matrix
        run: npm run test:rbac-matrix
      - name: Verify P1 authorization
        run: npm run test:p1-authorization
      - name: Verify AI clinical draft security
        run: npm run test:clinical-ai-draft
      - name: Verify PACS imaging contracts
        run: npm run test:pacs-contracts
      - name: Build application
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
          SESSION_SECRET: ci-build-secret-not-used-in-production
        run: npm run build

  p1-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: p1
          POSTGRES_PASSWORD: p1
          POSTGRES_DB: p1test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p1 -d p1test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --include=dev --ignore-scripts; else npm install --include=dev --ignore-scripts; fi
      - name: P1 integration tests (Postgres)
        env:
          P1_TEST_DATABASE_URL: postgresql://p1:p1@127.0.0.1:5432/p1test?schema=public
        run: npm run test:p1-integration
      - name: Validate ImagingStudy migration on disposable PostgreSQL database
        env:
          PGPASSWORD: p1
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          createdb -h 127.0.0.1 -U p1 pacstest

          # 1) Minimal fixture parent tables (SQL only)
          psql -h 127.0.0.1 -U p1 -d pacstest -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE "Clinic" ("id" TEXT PRIMARY KEY);
          CREATE TABLE "Patient" ("id" TEXT PRIMARY KEY);
          CREATE TABLE "DiagnosticOrder" ("id" TEXT PRIMARY KEY);
          SQL

          # 2) Apply migration outside any open SQL heredoc
          psql -h 127.0.0.1 -U p1 -d pacstest -v ON_ERROR_STOP=1 -f prisma/migrations/20261012080000_imaging_study/migration.sql

          # 3) Insert fixtures (omit status so DEFAULT 'PENDING' is applied)
          psql -h 127.0.0.1 -U p1 -d pacstest -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "Clinic" ("id") VALUES ('clinic-test');
          INSERT INTO "Patient" ("id") VALUES ('patient-test');
          INSERT INTO "ImagingStudy" ("id", "clinicId", "patientId", "studyInstanceUid")
            VALUES ('study-test', 'clinic-test', 'patient-test', '1.2.840.10008.1');
          SQL

          # 4) Bash assertion after heredoc has closed — not sent to psql as SQL
          status="$(psql -h 127.0.0.1 -U p1 -d pacstest -v ON_ERROR_STOP=1 -Atc "SELECT \"status\" FROM \"ImagingStudy\" WHERE \"id\" = 'study-test';")"
          if [ "$status" != "PENDING" ]; then
            echo "Expected status PENDING; got: ${status}" >&2
            exit 1
          fi
          echo "ImagingStudy migration default verified: $status"

      - name: Validate PharmacyItem clinic scope reconciliation on disposable PostgreSQL database
        env:
          PGPASSWORD: p1
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U p1 pharmacyscopetest

          # Start from the pre-reconciliation shape, with an existing stock row.
          psql -h 127.0.0.1 -U p1 -d pharmacyscopetest -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE "Clinic" ("id" TEXT PRIMARY KEY);
          CREATE TABLE "PharmacyItem" (
            "id" TEXT PRIMARY KEY,
            "doctorId" TEXT NOT NULL,
            "name" TEXT NOT NULL
          );
          INSERT INTO "Clinic" ("id") VALUES ('clinic-test');
          INSERT INTO "PharmacyItem" ("id", "doctorId", "name")
            VALUES ('stock-test', 'doctor-test', 'Test medicine');
          SQL

          # Apply twice to prove idempotence, as well as preservation of existing stock rows.
          psql -h 127.0.0.1 -U p1 -d pharmacyscopetest -v ON_ERROR_STOP=1 -f prisma/migrations/20261020180000_reconcile_pharmacy_clinic_scope/migration.sql
          psql -h 127.0.0.1 -U p1 -d pharmacyscopetest -v ON_ERROR_STOP=1 -f prisma/migrations/20261020180000_reconcile_pharmacy_clinic_scope/migration.sql

          nullable="$(psql -h 127.0.0.1 -U p1 -d pharmacyscopetest -v ON_ERROR_STOP=1 -Atc "SELECT is_nullable FROM information_schema.columns WHERE table_schema='public' AND table_name='PharmacyItem' AND column_name='clinicId';")"
          stock_count="$(psql -h 127.0.0.1 -U p1 -d pharmacyscopetest -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM \"PharmacyItem\" WHERE \"id\"='stock-test';")"
          index_count="$(psql -h 127.0.0.1 -U p1 -d pharmacyscopetest -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND tablename='PharmacyItem' AND indexname='PharmacyItem_clinicId_idx';")"
          fk_count="$(psql -h 127.0.0.1 -U p1 -d pharmacyscopetest -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM pg_constraint WHERE conname='PharmacyItem_clinicId_fkey' AND conrelid='\"PharmacyItem\"'::regclass;")"

          [ "$nullable" = "YES" ] || { echo "Expected nullable clinicId, got: $nullable" >&2; exit 1; }
          [ "$stock_count" = "1" ] || { echo "Existing PharmacyItem row was not preserved" >&2; exit 1; }
          [ "$index_count" = "1" ] || { echo "Expected PharmacyItem clinicId index" >&2; exit 1; }
          [ "$fk_count" = "1" ] || { echo "Expected PharmacyItem clinicId FK" >&2; exit 1; }
          echo "PharmacyItem clinic scope migration is idempotent and preserves existing stock."
      - name: Prepare orphaned migration history on disposable PostgreSQL
        env:
          PGPASSWORD: p1
          DATABASE_URL: postgresql://p1:p1@127.0.0.1:5432/migrationhistorytest?schema=public
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U p1 migrationhistorytest

          # Build an isolated schema and baseline all repository migrations except the
          # new forward reconcile migration. This test is restricted to localhost CI.
          npx prisma db push --skip-generate
          for dir in prisma/migrations/*; do
            [ -d "$dir" ] || continue
            migration_name="$(basename "$dir")"
            if [ "$migration_name" = "20261020180000_reconcile_pharmacy_clinic_scope" ]; then
              continue
            fi
            npx prisma migrate resolve --applied "$migration_name"
          done

          # Model the already-finished historical migration row seen in Neon but
          # absent from repository history. Do not invent or execute its original SQL.
          psql -h 127.0.0.1 -U p1 -d migrationhistorytest -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "_prisma_migrations"
            ("id", "checksum", "finished_at", "migration_name", "started_at", "applied_steps_count")
          VALUES
            (gen_random_uuid()::text,
             '07d7fbd76100ec1005e009cd640ea2134a56402cb66bb5a64565f2ae878e2093',
             CURRENT_TIMESTAMP,
             '20260923100000_pharmacy_clinic_scope',
             CURRENT_TIMESTAMP,
             1);
          SQL
          orphan_count="$(psql -h 127.0.0.1 -U p1 -d migrationhistorytest -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM \"_prisma_migrations\" WHERE \"migration_name\"='20260923100000_pharmacy_clinic_scope' AND \"finished_at\" IS NOT NULL;")"
          [ "$orphan_count" = "1" ] || { echo "Historical orphan row was not created" >&2; exit 1; }
          echo "Disposable DB prepared with pending forward migration and an orphaned applied row."

      - name: Build Render container for startup smoke test
        run: docker build --pull=false -t medlum-render-smoke .

      - name: Smoke-test Render startup, migration deploy, and HTTP port
        env:
          DATABASE_URL: postgresql://p1:p1@127.0.0.1:5432/migrationhistorytest?schema=public
          SESSION_SECRET: ci-render-smoke-test-not-production
        run: |
          set -euo pipefail
          docker rm -f medlum-render-smoke >/dev/null 2>&1 || true
          trap 'docker rm -f medlum-render-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name medlum-render-smoke --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SESSION_SECRET="$SESSION_SECRET" \
            -e PORT=10000 \
            medlum-render-smoke >/dev/null

          healthy=0
          for i in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:10000/api/health >/tmp/medlum-render-health.json; then
              healthy=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' medlum-render-smoke)" != "true" ]; then
              docker logs medlum-render-smoke >&2 || true
              echo "Render container exited before opening port 10000" >&2
              exit 1
            fi
            sleep 2
          done
          if [ "$healthy" != "1" ]; then
            docker logs medlum-render-smoke >&2 || true
            echo "Render container did not answer /api/health on port 10000" >&2
            exit 1
          fi
          cat /tmp/medlum-render-health.json
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/medlum-render-health.json

      - name: Verify Render startup migration results on disposable PostgreSQL
        env:
          PGPASSWORD: p1
        run: |
          set -euo pipefail
          orphan_count="$(psql -h 127.0.0.1 -U p1 -d migrationhistorytest -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM \"_prisma_migrations\" WHERE \"migration_name\"='20260923100000_pharmacy_clinic_scope' AND \"finished_at\" IS NOT NULL;")"
          forward_count="$(psql -h 127.0.0.1 -U p1 -d migrationhistorytest -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM \"_prisma_migrations\" WHERE \"migration_name\"='20261020180000_reconcile_pharmacy_clinic_scope' AND \"finished_at\" IS NOT NULL;")"
          [ "$orphan_count" = "1" ] || { echo "Historical orphan row was not preserved" >&2; exit 1; }
          [ "$forward_count" = "1" ] || { echo "Forward reconcile migration did not finish" >&2; exit 1; }
          echo "Render entrypoint successfully deployed the idempotent forward migration and preserved historical migration metadata."
      - name: P1 RBAC tenant isolation (Postgres)
        env:
          P1_TEST_DATABASE_URL: postgresql://p1:p1@127.0.0.1:5432/p1test?schema=public
        run: npm run test:rbac-tenant-isolation
      - name: Verify P2-07 MAR database invariants
        env:
          P2_07_TEST_DATABASE_URL: postgresql://p1:p1@127.0.0.1:5432/p1test?schema=public
        run: npm run test:p2-07

  pacs-synthetic-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start isolated Orthanc with DICOMweb
        run: |
          set -euo pipefail
          docker network create medlum-pacs-ci
          docker run -d --name medlum-orthanc-ci --network medlum-pacs-ci \
            -p 127.0.0.1:8042:8042 \
            -e ORTHANC__NAME=MedLum-Synthetic-CI \
            -e ORTHANC__AUTHENTICATION_ENABLED=false \
            -e ORTHANC__DICOM_WEB__ENABLE=true \
            -e ORTHANC__REMOTE_ACCESS_ALLOWED=true \
            orthancteam/orthanc:latest
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8042/system >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs medlum-orthanc-ci
            exit 1
          fi
      - name: Create synthetic DICOM with pixel data
        run: |
          python -m pip install --disable-pip-version-check pydicom numpy
          python - <<'PY'
          import datetime, numpy as np, pydicom
          from pydicom.dataset import FileDataset, FileMetaDataset
          from pydicom.uid import ExplicitVRLittleEndian, generate_uid, SecondaryCaptureImageStorage
          meta = FileMetaDataset()
          meta.MediaStorageSOPClassUID = SecondaryCaptureImageStorage
          meta.MediaStorageSOPInstanceUID = generate_uid()
          meta.TransferSyntaxUID = ExplicitVRLittleEndian
          meta.ImplementationClassUID = generate_uid()
          ds = FileDataset("synthetic.dcm", {}, file_meta=meta, preamble=b"\0" * 128)
          ds.SOPClassUID = meta.MediaStorageSOPClassUID
          ds.SOPInstanceUID = meta.MediaStorageSOPInstanceUID
          ds.StudyInstanceUID = generate_uid()
          ds.SeriesInstanceUID = generate_uid()
          ds.PatientName = "SYNTHETIC^MEDLUM"
          ds.PatientID = "SYNTHETIC-CI-NOT-A-REAL-PATIENT"
          ds.Modality = "OT"
          ds.StudyDate = datetime.date.today().strftime("%Y%m%d")
          ds.StudyTime = "120000"
          ds.Rows, ds.Columns = 16, 16
          ds.SamplesPerPixel = 1
          ds.PhotometricInterpretation = "MONOCHROME2"
          ds.BitsAllocated, ds.BitsStored, ds.HighBit = 16, 16, 15
          ds.PixelRepresentation = 0
          ds.PixelData = np.arange(256, dtype=np.uint16).reshape(16, 16).tobytes()
          ds.save_as("synthetic.dcm", enforce_file_format=True)
          print("Created synthetic DICOM with 256 deterministic pixels")
          PY
      - name: Upload study and verify Orthanc plus DICOMweb pixel retrieval
        run: |
          set -euo pipefail
          upload="$(curl --fail --silent --show-error -X POST \
            http://127.0.0.1:8042/instances \
            -H 'Content-Type: application/dicom' --data-binary @synthetic.dcm)"
          echo "$upload" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("Status") == "Success", d; print("Orthanc instance upload: Success")'
          study_uid="$(python -c 'import pydicom; print(pydicom.dcmread("synthetic.dcm").StudyInstanceUID)')"
          printf '%s' "$study_uid" > study_uid.txt
          series_uid="$(python -c 'import pydicom; print(pydicom.dcmread("synthetic.dcm").SeriesInstanceUID)')"
          instance_uid="$(python -c 'import pydicom; print(pydicom.dcmread("synthetic.dcm").SOPInstanceUID)')"
          curl --fail --silent --show-error \
            "http://127.0.0.1:8042/dicom-web/studies?StudyInstanceUID=$study_uid" \
            -H 'Accept: application/dicom+json' -o qido.json
          python - <<'PY'
          import json
          data=json.load(open("qido.json"))
          assert data, "DICOMweb QIDO returned no studies"
          assert any(x.get("0020000D", {}).get("Value", [None])[0] for x in data), "Study UID missing from QIDO response"
          print("DICOMweb QIDO study query: passed")
          PY
          curl --fail --silent --show-error \
            "http://127.0.0.1:8042/dicom-web/studies/$study_uid/series/$series_uid/instances/$instance_uid/frames/1" \
            -H 'Accept: multipart/related; type="application/octet-stream"; transfer-syntax=*' \
            -o frame-response.bin -D frame-headers.txt
          grep -qi 'content-type: multipart/related' frame-headers.txt
          test -s frame-response.bin
          echo "DICOMweb WADO-RS frame retrieval: non-empty pixel-frame response"
          curl --fail --silent --show-error \
            "http://127.0.0.1:8042/instances/$(echo "$upload" | python -c 'import json,sys; print(json.load(sys.stdin)["ID"])')/file" \
            -o roundtrip.dcm
          python - <<'PY'
          import numpy as np, pydicom
          ds=pydicom.dcmread("roundtrip.dcm")
          pixels=ds.pixel_array
          assert pixels.shape == (16,16), pixels.shape
          assert int(pixels[0,0]) == 0 and int(pixels[15,15]) == 255
          print("DICOM round-trip pixel integrity: passed (16x16 synthetic image)")
          PY
          # Mirror MedLum trusted verification: Orthanc /tools/find by StudyInstanceUID
          find_payload="$(python -c 'import json,pydicom; print(json.dumps({"Level":"Study","Query":{"StudyInstanceUID":pydicom.dcmread("synthetic.dcm").StudyInstanceUID},"Expand":False}))')"
          find_ids="$(curl --fail --silent --show-error -X POST http://127.0.0.1:8042/tools/find -H 'Content-Type: application/json' -d "$find_payload")"
          echo "$find_ids" | python -c 'import json,sys; ids=json.load(sys.stdin); assert isinstance(ids,list) and len(ids)>=1, ids; print("Orthanc tools/find verification path: passed", ids[0])'
          study_meta="$(curl --fail --silent --show-error "http://127.0.0.1:8042/studies/$(echo "$find_ids" | python -c 'import json,sys; print(json.load(sys.stdin)[0])')")"
          echo "$study_meta" | python -c 'import json,sys,pydicom; m=json.load(sys.stdin); uid=m["MainDicomTags"]["StudyInstanceUID"]; expect=pydicom.dcmread("synthetic.dcm").StudyInstanceUID; assert uid==expect, (uid,expect); print("Orthanc study UID match: passed")'
      - name: Render synthetic DICOM in OHIF browser
        run: |
          set -euo pipefail
          cat > ohif-ci-config.js <<'OHIF'
          window.config = {
            routerBasename: '/',
            extensions: [],
            modes: [],
            showStudyList: false,
            dataSources: [{
              namespace: '@ohif/extension-default.dataSourcesModule.dicomweb',
              sourceName: 'dicomweb',
              configuration: {
                friendlyName: 'MedLum synthetic Orthanc',
                name: 'orthanc',
                qidoRoot: window.location.origin + '/dicom-web',
                wadoRoot: window.location.origin + '/dicom-web',
                wadoUriRoot: window.location.origin + '/wado',
                qidoSupportsIncludeField: true,
                supportsReject: false,
                imageRendering: 'wadors',
                thumbnailRendering: 'wadors',
                enableStudyLazyLoad: true,
                supportsFuzzyMatching: false,
                supportsWildcard: false
              }
            }],
            defaultDataSourceName: 'dicomweb'
          };
          OHIF
          docker run -d --name medlum-ohif-ci --network medlum-pacs-ci \
            -e APP_CONFIG="$(cat ohif-ci-config.js)" ohif/app:v3.9.2
          cat > nginx-pacs-ci.conf <<'NGINX'
          server {
            listen 8080;
            server_name _;
            location /dicom-web/ {
              proxy_pass http://medlum-orthanc-ci:8042/dicom-web/;
              proxy_set_header Host $host;
            }
            location /wado {
              proxy_pass http://medlum-orthanc-ci:8042/wado;
              proxy_set_header Host $host;
            }
            location / {
              proxy_pass http://medlum-ohif-ci:80;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $scheme;
            }
          }
          NGINX
          docker run -d --name medlum-pacs-proxy-ci --network medlum-pacs-ci \
            -p 127.0.0.1:8080:8080 \
            -v "$PWD/nginx-pacs-ci.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs medlum-ohif-ci
            docker logs medlum-pacs-proxy-ci
            exit 1
          fi
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          PACS_TEST_STUDY_UID="$(cat study_uid.txt)" node scripts/verify-pacs-ohif-browser.mjs
      - name: Stop isolated Orthanc and OHIF
        if: always()
        run: |
          docker rm -f medlum-pacs-proxy-ci medlum-ohif-ci medlum-orthanc-ci || true
          docker network rm medlum-pacs-ci || true

  clinical-assist-runtime:
    name: Clinical Assist runtime acceptance (synthetic PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medlum
          POSTGRES_PASSWORD: medlum_test_only
          POSTGRES_DB: medlum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medlum -d medlum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://medlum:medlum_test_only@127.0.0.1:5432/medlum_test?schema=public
      SESSION_SECRET: ephemeral-ci-only-session-secret-never-use-in-production-2026-001
      MEDLUM_CI_SYNTHETIC_FIXTURE: "YES"
      MEDLUM_RUNTIME_TEST_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --include=dev --ignore-scripts; else npm install --include=dev --ignore-scripts; fi
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Create ephemeral schema
        run: npx prisma db push --skip-generate
      - name: Seed synthetic clinic and failed lab documents
        run: node scripts/seed-clinical-assist-runtime.mjs
      - name: Start local Next.js app
        run: |
          npm run dev -- --webpack --hostname 127.0.0.1 > /tmp/medlum-next.log 2>&1 &
          echo $! > /tmp/medlum-next.pid
      - name: Wait for app readiness
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3000/api/health >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/medlum-next.log
            exit 1
          fi
      - name: Run authenticated Clinical Assist route acceptance
        run: npm run test:clinical-assist-runtime
      - name: Run password reset HTTP runtime acceptance
        run: npm run test:password-reset-runtime
      - name: Print application logs on failure
        if: failure()
        run: cat /tmp/medlum-next.log
