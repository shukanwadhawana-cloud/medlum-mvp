name: fix-clinic-page
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair clinic page if needed
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/app/clinic/page.tsx")
          if not p.exists():
              print("clinic page missing; skip")
              raise SystemExit(0)
          t = p.read_text()
          # no-op historical repair workflow preserved for manual dispatch only
          print("clinic page size", len(t))
          PY
      - name: Commit if changed
        run: |
          git config user.name "medlum-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "fix(clinic): historical clinic page repair (manual)"
          git push origin HEAD:main
