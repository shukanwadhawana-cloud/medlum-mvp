name: land-opd-print-btn2
on:
  workflow_dispatch:
jobs:
  land:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Insert button before Back link
        run: |
          set -euo pipefail
          python3 -c "
          from pathlib import Path
          p = Path('src/app/patients/[id]/page.tsx')
          t = p.read_text()
          if 'Print OPD Record' in t:
              print('already')
          else:
              old = '<Link href=\"/patients\" className=\"h-9 px-3 rounded-lg border text-xs font-medium inline-flex items-center\">Back</Link>'
              new = '<Link href={{\`/patients/\${id}/print\`}} className=\"h-9 px-3 rounded-lg border border-[#c2183a]/30 bg-[#c2183a]/5 text-[#c2183a] text-xs font-medium inline-flex items-center print:hidden\">Print OPD Record</Link>\\n            ' + old
              if old not in t:
                  raise SystemExit('back link not found')
              p.write_text(t.replace(old, new, 1))
              print('ok')
          "
      - name: Commit
        run: |
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add "src/app/patients/[id]/page.tsx"
          git commit -m "feat(opd): Print OPD Record button on patient workspace" || exit 0
          git push origin HEAD:main
