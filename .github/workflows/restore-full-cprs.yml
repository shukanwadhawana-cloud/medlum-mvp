name: Restore Full CPRS
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Historical full CPRS restore (manual only)
        run: |
          echo "This one-shot workflow is retained for history and manual dispatch only."
          echo "It no longer runs on push."
