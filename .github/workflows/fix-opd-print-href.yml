name: fix-opd-print-href
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix double-brace href
        run: |
          set -euo pipefail
          python3 -c "
          from pathlib import Path
          p = Path('src/app/patients/[id]/page.tsx')
          t = p.read_text()
          t2 = t.replace('href={{\`/patients/\${id}/print\`}}', 'href={\`/patients/\${id}/print\`}')
          if t2 == t:
              raise SystemExit('pattern not found')
          p.write_text(t2)
          print('fixed')
          "
      - name: Commit
        run: |
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add "src/app/patients/[id]/page.tsx"
          git commit -m "fix(opd): correct Print OPD Record Link href JSX" || exit 0
          git push origin HEAD:main
