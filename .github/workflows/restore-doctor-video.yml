name: restore-doctor-video
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore from previous good blob via git
        run: |
          set -euo pipefail
          # Recover from history before PLACEHOLDER commit
          git fetch --depth=20 origin main
          # Find last good version containing openConferenceInNewTab
          for c in $(git log --oneline -15 --format=%H -- "src/app/telemedicine/[id]/page.tsx"); do
            if git show "$c:src/app/telemedicine/[id]/page.tsx" 2>/dev/null | grep -q openConferenceInNewTab; then
              git show "$c:src/app/telemedicine/[id]/page.tsx" > "src/app/telemedicine/[id]/page.tsx"
              echo "restored from $c"
              break
            fi
          done
          if grep -q PLACEHOLDER "src/app/telemedicine/[id]/page.tsx"; then
            echo "still placeholder" >&2
            exit 1
          fi
          # Ensure open-before-await order
          python3 -c "
          from pathlib import Path
          p=Path('src/app/telemedicine/[id]/page.tsx')
          t=p.read_text()
          if 'async function openVideoWithMic' in t and 'await requestCameraMic' in t:
            import re
            t=re.sub(
              r'async function openVideoWithMic\\(\\) \\{[\\s\\S]*?\\n  \\',
              '''function openVideoWithMic() {
    setError(\"\");
    setPermHint(\"\");
    const url = session?.meetingUrl;
    if (!url) { setError(\"Video room is not ready yet.\"); return; }
    openConferenceInNewTab(url);
    void requestCameraMic().then(() => setMsg(\"Video opened in a new tab. Allow mic/camera if asked.\")).catch(() => setPermHint(\"Allow Microphone in browser settings.\"));
  }''',
              t, count=1)
            p.write_text(t)
            print('reordered')
          else:
            print('order ok or pattern skipped')
          "
      - name: Commit
        run: |
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add "src/app/telemedicine/[id]/page.tsx"
          git commit -m "fix(telemedicine): restore clinician MiroTalk page (Safari-safe)" || exit 0
          git push origin HEAD:main
