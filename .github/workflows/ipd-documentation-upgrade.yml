name: IPD Documentation Upgrade
on:
  push:
    branches: [fix/ipd-live-clinical-workflow]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade IPD documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/app/ipd/page.tsx')
          s=p.read_text()
          needle='const[vitals,setVitals]=useState({bp:"",pulse:"",rr:"",spo2:"",temperature:""}),[error,setError]=useState("")'
          repl='const[vitals,setVitals]=useState({bp:"",pulse:"",rr:"",spo2:"",temperature:""}),[structured,setStructured]=useState({dateTime:new Date().toISOString().slice(0,16),diagnosis:"",hpi:"",allergy:"",examTime:"",cns:"",cvs:"",rs:"",perAbdomen:"",assessment:"",workingDiagnosis:"",treatmentGiven:"",course:"",procedures:"",investigations:"",dischargeTreatment:"",followUpDate:""}),[error,setError]=useState("")'
          if needle not in s: raise SystemExit('state needle missing')
          s=s.replace(needle,repl,1)
          needle=' const post=async(body:any)=>'
          helper=' const buildStructuredContent=()=>{const x=structured;return `Date & time: ${x.dateTime}\\nDiagnosis: ${x.diagnosis}\\nHistory of present illness: ${x.hpi}\\nAllergy: ${x.allergy}\\nExamination time: ${x.examTime}\\nVitals: BP ${vitals.bp} | Pulse ${vitals.pulse} | RR ${vitals.rr} | SpO₂ ${vitals.spo2} | Temperature ${vitals.temperature}\\nAssessment — CNS: ${x.cns}\\nAssessment — CVS: ${x.cvs}\\nAssessment — Respiratory system: ${x.rs}\\nAssessment — Per abdomen: ${x.perAbdomen}\\nAssessment / findings: ${x.assessment}\\nWorking diagnosis: ${x.workingDiagnosis}\\nTreatment given: ${x.treatmentGiven}\\nCourse during admission: ${x.course}\\nProcedures performed: ${x.procedures}\\nInvestigations advised / results: ${x.investigations}\\nTreatment on discharge: ${x.dischargeTreatment}\\nFollow-up date: ${x.followUpDate}`};\\n'
          if needle not in s: raise SystemExit('post needle missing')
          s=s.replace(needle,helper+needle,1)
          pat=r' const saveNote=async\(e:React\.FormEvent\)=>\{.*?\};'
          new=' const saveNote=async(e:React.FormEvent)=>{e.preventDefault();if(!selected)return;const content=buildStructuredContent();if(!(await run({action:"clinical-note",patientId:selected.id,noteType:note.noteType,content,authorRole:`${doctor?.name||"Logged-in clinician"} · ${note.noteType}`},`${note.noteType} saved to IPD history`)))return;setNote({noteType:"Consultant Note",content:""});setStructured({...structured,dateTime:new Date().toISOString().slice(0,16)})};'
          s,n=re.subn(pat,new,s,count=1)
          if n!=1: raise SystemExit('saveNote missing')
          pat=r'<form onSubmit=\{saveNote\} className="border rounded-xl p-3">.*?</form>'
          form='''<form onSubmit={saveNote} className="border rounded-xl p-3 lg:col-span-2"><div className="flex items-center justify-between gap-2 mb-2"><div><h4 className="font-semibold text-xs">Structured clinical documentation</h4><p className="text-[10px] text-gray-500">Timestamped and attributed to the logged-in clinician. Nursing entries include findings observed during assessment.</p></div><select value={note.noteType} onChange={e=>setNote({...note,noteType:e.target.value})} className="h-9 px-2 rounded-lg border text-xs">{NOTE_TYPES.map(x=><option key={x}>{x}</option>)}</select></div><div className="grid md:grid-cols-3 gap-2"><Field label="Date & time" value={structured.dateTime} onChange={v=>setStructured({...structured,dateTime:v})} required/><Field label="Diagnosis" value={structured.diagnosis} onChange={v=>setStructured({...structured,diagnosis:v})}/><Field label="Allergy" value={structured.allergy||selected.allergies||""} onChange={v=>setStructured({...structured,allergy:v})}/><Area label="History of present illness" value={structured.hpi} onChange={v=>setStructured({...structured,hpi:v})}/><Field label="Examination time" value={structured.examTime} onChange={v=>setStructured({...structured,examTime:v})}/><Area label="Assessment / findings" value={structured.assessment} onChange={v=>setStructured({...structured,assessment:v})} placeholder="Record what you observed/found during assessment."/><Area label="CNS" value={structured.cns} onChange={v=>setStructured({...structured,cns:v})}/><Area label="CVS" value={structured.cvs} onChange={v=>setStructured({...structured,cvs:v})}/><Area label="Respiratory system" value={structured.rs} onChange={v=>setStructured({...structured,rs:v})}/><Area label="Per abdomen" value={structured.perAbdomen} onChange={v=>setStructured({...structured,perAbdomen:v})}/><Area label="Working diagnosis" value={structured.workingDiagnosis} onChange={v=>setStructured({...structured,workingDiagnosis:v})}/><Area label="Treatment given" value={structured.treatmentGiven} onChange={v=>setStructured({...structured,treatmentGiven:v})}/><Area label="Course during admission" value={structured.course} onChange={v=>setStructured({...structured,course:v})}/><Area label="Procedures performed" value={structured.procedures} onChange={v=>setStructured({...structured,procedures:v})}/><Area label="Investigations advised / results" value={structured.investigations} onChange={v=>setStructured({...structured,investigations:v})}/><Area label="Treatment on discharge" value={structured.dischargeTreatment} onChange={v=>setStructured({...structured,dischargeTreatment:v})}/><Field label="Follow-up date" value={structured.followUpDate} onChange={v=>setStructured({...structured,followUpDate:v})}/></div><button disabled={saving} className="mt-2 h-9 px-3 rounded-lg bg-[#c2183a] text-white text-xs">{saving?"Saving…":"Save Structured Entry"}</button></form>'''
          s,n=re.subn(pat,form,s,count=1)
          if n!=1: raise SystemExit('note form missing')
          needle='</div></section>}\n {showRegister&&'
          timeline='''</div><div className="mt-4 border rounded-xl p-3"><div className="flex items-center justify-between"><div><h4 className="font-semibold text-sm">IPD Documentation Timeline</h4><p className="text-[10px] text-gray-500">Chronological record with date, time, documentation type and clinician attribution.</p></div><span className="text-[10px] text-gray-500">{selected.clinicalNotes?.length||0} entries</span></div><div className="mt-2 space-y-2">{selected.clinicalNotes?.length?selected.clinicalNotes.map((n:any,i:number)=><article key={`${n.id}-${i}`} className="border rounded-lg p-3"><div className="flex flex-wrap justify-between gap-2"><div><span className="font-semibold text-xs">{n.noteType||"Clinical Note"}</span><span className="ml-2 text-[10px] text-gray-500">{n.authorRole||"Clinician"}</span></div><time className="text-[10px] text-gray-500">{n.createdAt?new Date(n.createdAt).toLocaleString():"—"}</time></div><pre className="mt-2 whitespace-pre-wrap font-sans text-xs text-gray-700">{n.content||"—"}</pre></article>):<p className="text-xs text-gray-500 py-3">No documentation recorded yet.</p>}</div></div></section>}\n {showRegister&&'''
          if needle not in s: raise SystemExit('section close missing')
          s=s.replace(needle,timeline,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'IPD Documentation Timeline' src/app/ipd/page.tsx
          grep -q 'Structured clinical documentation' src/app/ipd/page.tsx
      - name: Commit upgrade and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/ipd/page.tsx
          git rm .github/workflows/ipd-documentation-upgrade.yml
          git diff --cached --check
          git commit -m 'feat(ipd): add structured notes and documentation timeline [skip ci]'
          git push origin HEAD:fix/ipd-live-clinical-workflow
