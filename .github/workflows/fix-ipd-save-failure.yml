name: Patch IPD failed-save handling

on:
  push:
    branches:
      - fix/ipd-live-clinical-workflow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ipd-live-clinical-workflow
          fetch-depth: 0
      - name: Patch failed-save handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/ipd/page.tsx')
          s = p.read_text()
          old = 'const run=async(body:any,success:string)=>{setSaving(true);setError("");setMsg("");try{await post(body);setMsg(success);await load()}catch(e:any){setError(e.message||"Could not save")}finally{setSaving(false)}};'
          new = 'const run=async(body:any,success:string)=>{setSaving(true);setError("");setMsg("");try{await post(body);setMsg(success);await load();return true}catch(e:any){setError(e.message||"Could not save");return false}finally{setSaving(false)}};'
          if old not in s:
              raise SystemExit('Expected run() implementation not found')
          s = s.replace(old, new, 1)
          replacements = {
            'e.preventDefault();await run({action:"register",...form},`${form.careSetting} patient registered`);setShowRegister(false);setForm(empty)': 'e.preventDefault();if(!(await run({action:"register",...form},`${form.careSetting} patient registered`)))return;setShowRegister(false);setForm(empty)',
            'e.preventDefault();await run({action:"room",...room},"Room added to hospital directory");setShowRoom(false);setRoom({roomNumber:"",roomCategory:"General Ward",unitType:"Ward"})': 'e.preventDefault();if(!(await run({action:"room",...room},"Room added to hospital directory")))return;setShowRoom(false);setRoom({roomNumber:"",roomCategory:"General Ward",unitType:"Ward"})',
            'e.preventDefault();if(!selected)return;await run({action:"clinical-note",patientId:selected.id,...note},`${note.noteType} saved to IPD history`);setNote({noteType:"Consultant Note",content:""})': 'e.preventDefault();if(!selected)return;if(!(await run({action:"clinical-note",patientId:selected.id,...note},`${note.noteType} saved to IPD history`)))return;setNote({noteType:"Consultant Note",content:""})',
            'e.preventDefault();if(!selected)return;const testName=investigation.testName==="OTHER / CUSTOM"?investigation.custom.trim():investigation.testName;if(!testName){setError("Enter the custom investigation name");return}await run({action:"lab-order",patientId:selected.id,testName,category:/x-ray|ct|mri|ultrasound|ecg|echo/i.test(testName)?"Diagnostic":"Laboratory",notes:investigation.notes},`Investigation Indent saved: ${testName}`);setInvestigation({testName:"CBC",custom:"",notes:""})': 'e.preventDefault();if(!selected)return;const testName=investigation.testName==="OTHER / CUSTOM"?investigation.custom.trim():investigation.testName;if(!testName){setError("Enter the custom investigation name");return}if(!(await run({action:"lab-order",patientId:selected.id,testName,category:/x-ray|ct|mri|ultrasound|ecg|echo/i.test(testName)?"Diagnostic":"Laboratory",notes:investigation.notes},`Investigation Indent saved: ${testName}`)))return;setInvestigation({testName:"CBC",custom:"",notes:""})',
            'e.preventDefault();if(!selected)return;await run({action:"vitals",patientId:selected.id,...vitals},"Nursing round saved");setVitals({bp:"",pulse:"",rr:"",spo2:"",temperature:""})': 'e.preventDefault();if(!selected)return;if(!(await run({action:"vitals",patientId:selected.id,...vitals},"Nursing round saved")))return;setVitals({bp:"",pulse:"",rr:"",spo2:"",temperature:""})',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected handler pattern not found: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/fix-ipd-save-failure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/ipd/page.tsx .github/workflows/fix-ipd-save-failure.yml
          git diff --cached --check
          git commit -m 'fix(ipd): preserve forms when save fails [skip ci]'
          git push origin HEAD:fix/ipd-live-clinical-workflow
