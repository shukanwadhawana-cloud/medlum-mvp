name: MedLum Desktop Packaging

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "MedLum HTTPS URL for the desktop window (optional if repository variable MEDLUM_APP_URL is set)"
        required: false
        type: string

permissions:
  contents: read

env:
  # Prefer dispatch input when provided; otherwise repository Variable. Never hardcode production URL.
  MEDLUM_APP_URL: ${{ github.event.inputs.app_url || vars.MEDLUM_APP_URL }}

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: medlum-windows
          - os: macos-latest
            artifact: medlum-macos
          - os: ubuntu-latest
            artifact: medlum-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Require desktop app URL
        shell: bash
        run: |
          if [ -z "${MEDLUM_APP_URL}" ]; then
            echo "MEDLUM_APP_URL is required (workflow_dispatch input or repository Variable)."
            exit 1
          fi
          case "${MEDLUM_APP_URL}" in
            https://*) ;;
            *) echo "MEDLUM_APP_URL must be an https:// URL"; exit 1 ;;
          esac

      - name: Prepare desktop web shell
        shell: bash
        run: node scripts/prepare-desktop-web.mjs

      - name: Build desktop packages
        shell: bash
        run: npx electron-builder --publish never

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.yaml
          if-no-files-found: warn
