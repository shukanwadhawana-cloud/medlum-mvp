name: MedLum CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --include=dev --ignore-scripts; else npm install --include=dev --ignore-scripts; fi
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
        run: npx prisma generate
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Verify production security
        run: npm run test:production-security
      - name: Verify OWASP ASVS 5.0 hardening baseline
        run: npm run test:asvs-hardening
      - name: Verify CSRF and CSP hardening
        run: npm run test:csrf
      - name: Verify pilot readiness
        run: npm run test:pilot-readiness
      - name: Verify OPD and IPD pilot UI
        run: npm run test:ipd-pilot-ui
      - name: Verify EKA ABDM onboarding
        run: npm run test:eka
      - name: Verify MedLum data architecture
        run: npm run test:data-architecture
      - name: Verify data retention protections
        run: npm run test:data-retention
      - name: Verify soft deactivation protections
        run: npm run test:soft-deactivation
      - name: Verify disaster-recovery readiness
        run: npm run test:disaster-recovery-readiness
      - name: Verify Phase B legacy clinicId correction
        run: npm run test:phase-b-legacy-clinicid
      - name: Verify API authentication coverage
        run: npm run test:api-auth-coverage
      - name: Verify telemedicine foundation
        run: npm run test:telemedicine
      - name: Verify video consultation layer
        run: npm run test:video-consultation
      - name: Verify responsive UI and PWA hardening
        run: npm run test:responsive-ui
      - name: Verify Android and iOS packaging configuration
        run: npm run test:mobile-packaging
      - name: Verify Windows macOS Linux packaging configuration
        run: npm run test:desktop-packaging
      - name: Verify multi-device and role workflows
        run: npm run test:multi-device-role-workflow
      - name: Verify hospital foundation (OTP tariff lab lifecycle)
        run: npm run test:hospital-foundation
      - name: Verify invoice tariff snapshot + numbering
        run: npm run test:invoice-snapshot
      - name: Verify patient portal auth and dashboard
        run: npm run test:portal-auth
      - name: Verify multi-tenant isolation (static)
        run: npm run test:tenant-isolation
      - name: Verify P1 closure (static)
        run: npm run test:p1-closure
      - name: Verify staff and workforce management
        run: npm run test:staff-workforce
      - name: Verify duty and attendance management
        run: npm run test:duty
      - name: Verify role-aware staff access and navigation
        run: npm run test:role-access
      - name: Verify P1 identity and tenant security regressions
        run: npm run test:p1-security-regression
      - name: Facility data migration security
        run: npm run test:facility-data-migration
      - name: Verify patient discovery facility scope
        run: npm run test:patient-discovery
      - name: Verify P2-01 IPD discharge lifecycle
        run: npm run test:p2-01
      - name: Verify owner full-access entitlement
        run: npm run test:owner-full-access
      - name: Verify P2-02 IPD bed lifecycle
        run: npm run test:p2-02
      - name: Verify P2-03 IPD investigation review
        run: npm run test:p2-03
      - name: Verify P2-04 Emergency to IPD admission continuity
        run: npm run test:p2-04
      - name: Verify OPD admission bed categories and OCR regression safeguards
        run: npm run test:admission-bed-categories && npm run test:clinical-assist-ocr
      - name: Verify P2-05 IPD receiving-team handover
        run: npm run test:p2-05
      - name: Verify P2-06 IPD medication dispensing reconciliation
        run: npm run test:p2-06
      - name: Verify P2-07 MAR
        run: npm run test:p2-07
      - name: Verify issue 100 clinical workflows
        run: npm run test:issue-100
      - name: Verify IPD failed-save handling
        run: npm run test:ipd-save-error-handling
      - name: Verify clinical double-verification and final signing
        run: npm run test:clinical-signing
      - name: Verify record confirmation and cancellation lifecycle
        run: npm run test:record-confirmation
      - name: Verify OPD clinical record workflow
        run: npm run test:opd-clinical-record
      - name: Verify IPD clinical workflow
        run: npm run test:ipd-clinical-workflow
      - name: Verify RBAC matrix
        run: npm run test:rbac-matrix
      - name: Verify P1 authorization
        run: npm run test:p1-authorization
      - name: Verify AI clinical draft security
        run: npm run test:clinical-ai-draft
      - name: Build application
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
          SESSION_SECRET: ci-build-secret-not-used-in-production
        run: npm run build

  p1-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: p1
          POSTGRES_PASSWORD: p1
          POSTGRES_DB: p1test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p1 -d p1test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --include=dev --ignore-scripts; else npm install --include=dev --ignore-scripts; fi
      - name: P1 integration tests (Postgres)
        env:
          P1_TEST_DATABASE_URL: postgresql://p1:p1@127.0.0.1:5432/p1test?schema=public
        run: npm run test:p1-integration
      - name: Validate ImagingStudy migration on disposable PostgreSQL database
        env:
          PGPASSWORD: p1
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          createdb -h 127.0.0.1 -U p1 pacstest

          # 1) Minimal fixture parent tables (SQL only)
          psql -h 127.0.0.1 -U p1 -d pacstest -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE "Clinic" ("id" TEXT PRIMARY KEY);
          CREATE TABLE "Patient" ("id" TEXT PRIMARY KEY);
          CREATE TABLE "DiagnosticOrder" ("id" TEXT PRIMARY KEY);
          SQL

          # 2) Apply migration outside any open SQL heredoc
          psql -h 127.0.0.1 -U p1 -d pacstest -v ON_ERROR_STOP=1 -f prisma/migrations/20261012080000_imaging_study/migration.sql

          # 3) Insert fixtures (omit status so DEFAULT 'PENDING' is applied)
          psql -h 127.0.0.1 -U p1 -d pacstest -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "Clinic" ("id") VALUES ('clinic-test');
          INSERT INTO "Patient" ("id") VALUES ('patient-test');
          INSERT INTO "ImagingStudy" ("id", "clinicId", "patientId", "studyInstanceUid")
            VALUES ('study-test', 'clinic-test', 'patient-test', '1.2.840.10008.1');
          SQL

          # 4) Bash assertion after heredoc has closed — not sent to psql as SQL
          status="$(psql -h 127.0.0.1 -U p1 -d pacstest -v ON_ERROR_STOP=1 -Atc "SELECT \"status\" FROM \"ImagingStudy\" WHERE \"id\" = 'study-test';")"
          if [ "$status" != "PENDING" ]; then
            echo "Expected status PENDING; got: ${status}" >&2
            exit 1
          fi
          echo "ImagingStudy migration default verified: $status"
      - name: P1 RBAC tenant isolation (Postgres)
        env:
          P1_TEST_DATABASE_URL: postgresql://p1:p1@127.0.0.1:5432/p1test?schema=public
        run: npm run test:rbac-tenant-isolation
      - name: Verify P2-07 MAR database invariants
        env:
          P2_07_TEST_DATABASE_URL: postgresql://p1:p1@127.0.0.1:5432/p1test?schema=public
        run: npm run test:p2-07

  pacs-synthetic-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Start isolated Orthanc with DICOMweb
        run: |
          set -euo pipefail
          docker run -d --name medlum-orthanc-ci \
            -p 127.0.0.1:8042:8042 \
            -e ORTHANC__NAME=MedLum-Synthetic-CI \
            -e ORTHANC__AUTHENTICATION_ENABLED=false \
            -e ORTHANC__DICOM_WEB__ENABLE=true \
            -e ORTHANC__REMOTE_ACCESS_ALLOWED=true \
            orthancteam/orthanc:latest
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8042/system >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs medlum-orthanc-ci
            exit 1
          fi
      - name: Create synthetic DICOM with pixel data
        run: |
          python -m pip install --disable-pip-version-check pydicom numpy
          python - <<'PY'
          import datetime, numpy as np, pydicom
          from pydicom.dataset import FileDataset, FileMetaDataset
          from pydicom.uid import ExplicitVRLittleEndian, generate_uid, SecondaryCaptureImageStorage
          meta = FileMetaDataset()
          meta.MediaStorageSOPClassUID = SecondaryCaptureImageStorage
          meta.MediaStorageSOPInstanceUID = generate_uid()
          meta.TransferSyntaxUID = ExplicitVRLittleEndian
          meta.ImplementationClassUID = generate_uid()
          ds = FileDataset("synthetic.dcm", {}, file_meta=meta, preamble=b"\0" * 128)
          ds.SOPClassUID = meta.MediaStorageSOPClassUID
          ds.SOPInstanceUID = meta.MediaStorageSOPInstanceUID
          ds.StudyInstanceUID = generate_uid()
          ds.SeriesInstanceUID = generate_uid()
          ds.PatientName = "SYNTHETIC^MEDLUM"
          ds.PatientID = "SYNTHETIC-CI-NOT-A-REAL-PATIENT"
          ds.Modality = "OT"
          ds.StudyDate = datetime.date.today().strftime("%Y%m%d")
          ds.StudyTime = "120000"
          ds.Rows, ds.Columns = 16, 16
          ds.SamplesPerPixel = 1
          ds.PhotometricInterpretation = "MONOCHROME2"
          ds.BitsAllocated, ds.BitsStored, ds.HighBit = 16, 16, 15
          ds.PixelRepresentation = 0
          ds.PixelData = np.arange(256, dtype=np.uint16).reshape(16, 16).tobytes()
          ds.save_as("synthetic.dcm", enforce_file_format=True)
          print("Created synthetic DICOM with 256 deterministic pixels")
          PY
      - name: Upload study and verify Orthanc plus DICOMweb pixel retrieval
        run: |
          set -euo pipefail
          upload="$(curl --fail --silent --show-error -X POST \
            http://127.0.0.1:8042/instances \
            -H 'Content-Type: application/dicom' --data-binary @synthetic.dcm)"
          echo "$upload" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("Status") == "Success", d; print("Orthanc instance upload: Success")'
          study_uid="$(python -c 'import pydicom; print(pydicom.dcmread("synthetic.dcm").StudyInstanceUID)')"
          series_uid="$(python -c 'import pydicom; print(pydicom.dcmread("synthetic.dcm").SeriesInstanceUID)')"
          instance_uid="$(python -c 'import pydicom; print(pydicom.dcmread("synthetic.dcm").SOPInstanceUID)')"
          curl --fail --silent --show-error \
            "http://127.0.0.1:8042/dicom-web/studies?StudyInstanceUID=$study_uid" \
            -H 'Accept: application/dicom+json' -o qido.json
          python - <<'PY'
          import json
          data=json.load(open("qido.json"))
          assert data, "DICOMweb QIDO returned no studies"
          assert any(x.get("0020000D", {}).get("Value", [None])[0] for x in data), "Study UID missing from QIDO response"
          print("DICOMweb QIDO study query: passed")
          PY
          curl --fail --silent --show-error \
            "http://127.0.0.1:8042/dicom-web/studies/$study_uid/series/$series_uid/instances/$instance_uid/frames/1" \
            -H 'Accept: multipart/related; type="application/octet-stream"; transfer-syntax=*' \
            -o frame-response.bin -D frame-headers.txt
          grep -qi 'content-type: multipart/related' frame-headers.txt
          test -s frame-response.bin
          echo "DICOMweb WADO-RS frame retrieval: non-empty pixel-frame response"
          curl --fail --silent --show-error \
            "http://127.0.0.1:8042/instances/$(echo "$upload" | python -c 'import json,sys; print(json.load(sys.stdin)["ID"])')/file" \
            -o roundtrip.dcm
          python - <<'PY'
          import numpy as np, pydicom
          ds=pydicom.dcmread("roundtrip.dcm")
          pixels=ds.pixel_array
          assert pixels.shape == (16,16), pixels.shape
          assert int(pixels[0,0]) == 0 and int(pixels[15,15]) == 255
          print("DICOM round-trip pixel integrity: passed (16x16 synthetic image)")
          PY
      - name: Stop isolated Orthanc
        if: always()
        run: docker rm -f medlum-orthanc-ci || true
