name: MedLum Mobile Packaging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "src/**"
      - ".github/workflows/mobile-packaging.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Prepare Capacitor web directory
        run: |
          mkdir -p out
          printf '<!doctype html><html><body>MedLum</body></html>' > out/index.html

      - name: Add Android native project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build unsigned debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: medlum-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-project:
    runs-on: ubuntu-latest
    env:
      CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Prepare Capacitor web directory
        run: |
          mkdir -p out
          printf '<!doctype html><html><body>MedLum</body></html>' > out/index.html

      - name: Add iOS native project
        run: npx cap add ios

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Upload iOS Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: medlum-ios-xcode-project
          path: ios
          if-no-files-found: error
