name: fix-p1-staff-prefix
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update P1 closure staff checks
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("scripts/verify-p1-closure.mjs")
          t = p.read_text()
          t = t.replace(
              'ok(staffId.includes("DOC") && staffId.includes("LAB"), "DOC/LAB prefixes");',
              'ok((staffId.includes("CL") || staffId.includes("DOC")) && (staffId.includes("LB") || staffId.includes("LAB")), "CL/LB (or legacy DOC/LAB) prefixes");',
          )
          t = t.replace(
              'ok(staffId.includes("padStart(4"), "zero-padded sequence");',
              'ok(staffId.includes("padStart") || staffId.includes("randomBytes"), "staff code suffix generation");',
          )
          p.write_text(t)
          print("updated")
          PY
      - name: Commit
        run: |
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add scripts/verify-p1-closure.mjs
          git commit -m "test: accept CL/RN/ON staff login prefixes in P1 closure" || exit 0
          git push origin HEAD:main
