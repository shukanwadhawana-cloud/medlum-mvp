name: patch-staff-login-ui
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: sed patches
        run: |
          set -euo pipefail
          # apiLogin
          sed -i 's/apiLogin(email: string, password: string)/apiLogin(staffId: string, password: string)/' src/lib/api.ts
          sed -i 's/JSON.stringify({ email, password })/JSON.stringify({ staffId, password })/' src/lib/api.ts
          # login page state + call
          sed -i 's/const \[email, setEmail\] = useState("");/const [staffId, setStaffId] = useState("");/' src/app/login/page.tsx
          sed -i 's/apiLogin(email, password)/apiLogin(staffId, password)/' src/app/login/page.tsx
          sed -i 's/Invalid email or password/Invalid Staff Login ID or password/g' src/app/login/page.tsx
          sed -i 's/const emailValue = email.trim();/const staffIdValue = staffId.trim();/' src/app/login/page.tsx
          sed -i 's/if (!emailValue || !passwordValue)/if (!staffIdValue || !passwordValue)/' src/app/login/page.tsx
          sed -i 's/Enter email and password, then connect Telegram./Enter Staff Login ID and password, then connect Telegram./' src/app/login/page.tsx
          sed -i 's/{ email: emailValue, password: passwordValue }/{ staffId: staffIdValue, password: passwordValue }/' src/app/login/page.tsx
          # Replace Email label/input block markers
          python3 -c "
          from pathlib import Path
          p=Path('src/app/login/page.tsx')
          t=p.read_text()
          t=t.replace('type=\"email\"','type=\"text\"')
          t=t.replace('value={email}','value={staffId}')
          t=t.replace('setEmail(e.target.value)','setStaffId(e.target.value.toUpperCase())')
          t=t.replace('placeholder=\"you@clinic.com\"','placeholder=\"CL01038020\"')
          t=t.replace('autoComplete=\"email\"','autoComplete=\"username\"')
          t=t.replace('>Email</label>','>MedLum Staff ID</label>')
          p.write_text(t)
          print('login page python ok')
          "
          # clinic labels
          sed -i 's/Email \/ login/Email (contact \/ recovery - not login)/' src/app/clinic/page.tsx || true
          grep -n 'staffId\|MedLum Staff ID\|apiLogin(staffId' src/app/login/page.tsx src/lib/api.ts | head -20
      - name: Commit
        run: |
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add src/app/login/page.tsx src/lib/api.ts src/app/clinic/page.tsx
          git commit -m "feat(auth): Staff ID login UI and apiLogin" || exit 0
          git push origin HEAD:main
