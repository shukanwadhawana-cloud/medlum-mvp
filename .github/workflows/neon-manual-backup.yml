name: Manual Neon Database Backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    container:
      image: postgres:18

    steps:
      - name: Create database backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          mkdir -p backup
          pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-acl \
            --file="backup/medlum-$(date -u +%Y%m%d-%H%M%S).dump"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: medlum-neon-backup-${{ github.run_id }}
          path: backup/*.dump
          retention-days: 7
          if-no-files-found: error