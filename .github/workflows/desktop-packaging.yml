name: MedLum Desktop Packaging

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "MedLum HTTPS URL for the desktop window (optional if repository variable MEDLUM_APP_URL is set)"
        required: false
        type: string

permissions:
  contents: read

env:
  # Prefer dispatch input when provided; otherwise repository Variable. Never hardcode production URL.
  MEDLUM_APP_URL: ${{ github.event.inputs.app_url || vars.MEDLUM_APP_URL }}

jobs:
  verify:
    name: Verify desktop packaging configuration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Repo does not commit package-lock.json; match MedLum CI install style.
      - run: npm install --include=dev --ignore-scripts
      - run: npm run test:desktop-packaging

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --target x86_64-pc-windows-msvc
          - name: macOS
            os: macos-latest
            args: --target aarch64-apple-darwin --target x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: --target x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Require desktop app URL
        shell: bash
        run: |
          if [ -z "${MEDLUM_APP_URL}" ]; then
            echo "MEDLUM_APP_URL is required (workflow_dispatch input or repository Variable)."
            exit 1
          fi
          case "${MEDLUM_APP_URL}" in
            https://*) ;;
            *) echo "MEDLUM_APP_URL must be an https:// URL"; exit 1 ;;
          esac

      - name: Build desktop web shell
        run: npm run build:desktop-web

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDLUM_APP_URL: ${{ env.MEDLUM_APP_URL }}
        with:
          args: ${{ matrix.args }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medlum-desktop-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/*/release/bundle/**/*
          if-no-files-found: warn
