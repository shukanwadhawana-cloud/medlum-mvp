name: land-opd-edit
on:
  workflow_dispatch:
jobs:
  land:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add OPD edit
        run: |
          set -euo pipefail
          python3 << 'EOF'
          from pathlib import Path
          p = Path("src/app/opd/page.tsx")
          t = p.read_text()
          if "editId" in t:
              print("already")
          else:
              t = t.replace(
                  '  const [form, setForm] = useState({ name: "", age: "", gender: "Male", phone: "" });',
                  '  const [form, setForm] = useState({ name: "", age: "", gender: "Male", phone: "" });\n  const [editId, setEditId] = useState<string | null>(null);\n  const [editForm, setEditForm] = useState({ name: "", age: "", gender: "Male", phone: "" });',
              )
              save = "  async function saveEdit(e: React.FormEvent) {\n    e.preventDefault();\n    if (!editId) return;\n    setSaving(true); setErr(\"\"); setMsg(\"\");\n    try {\n      const r = await fetch(`/api/patients/${editId}`, { method: \"PATCH\", credentials: \"include\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify({ name: editForm.name.trim(), age: Number(editForm.age) || 0, gender: editForm.gender, phone: editForm.phone.trim() }) });\n      const j = await r.json().catch(() => ({}));\n      if (!r.ok) throw new Error(j.error || \"Could not update patient\");\n      setMsg(\"Patient details updated.\"); setEditId(null); await reload();\n    } catch (e) { setErr(e instanceof Error ? e.message : \"Could not update patient\"); }\n    finally { setSaving(false); }\n  }\n\n"
              t = t.replace("  const filtered = useMemo(() => {", save + "  const filtered = useMemo(() => {")
              t = t.replace("{filtered.map((p) => (", "{filtered.map((p, idx) => (")
              t = t.replace(
                  "<p className=\"truncate text-sm font-semibold\">{p.name}</p>",
                  "<p className=\"truncate text-sm font-semibold\"><span className=\"text-gray-400 font-normal mr-2\">{idx + 1}.</span>{p.name}</p>",
              )
              t = t.replace(
                  "<p className=\"mt-1 text-[10px] text-gray-400\">ID {p.id}</p>",
                  "<p className=\"mt-1 text-[10px] text-gray-400\">{p.uhid || p.registrationNo || `ID ${p.id.slice(0, 8)}`}</p>",
              )
              t = t.replace(
                  "Open OPD visit</Link>\n                  <Link href=\"/billing\"",
                  "Open OPD visit</Link>\n                  <button type=\"button\" onClick={() => { setEditId(p.id); setEditForm({ name: p.name, age: String(p.age || \"\"), gender: p.gender || \"Male\", phone: p.phone || \"\" }); }} className=\"h-8 rounded-lg border px-3 text-[11px] font-medium\">Edit</button>\n                  <Link href=\"/billing\"",
              )
              modal = "      {editId && (\n        <div className=\"fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center p-3\">\n          <form onSubmit={saveEdit} className=\"bg-white rounded-2xl w-full max-w-md p-4 shadow-xl space-y-2\">\n            <h3 className=\"text-base font-semibold\">Edit patient details</h3>\n            <input required value={editForm.name} onChange={(e) => setEditForm({ ...editForm, name: e.target.value })} placeholder=\"Full name\" className=\"w-full h-11 rounded-lg border px-3 text-sm\" />\n            <div className=\"grid grid-cols-2 gap-2\">\n              <input required value={editForm.age} onChange={(e) => setEditForm({ ...editForm, age: e.target.value })} placeholder=\"Age\" inputMode=\"numeric\" className=\"h-11 rounded-lg border px-3 text-sm\" />\n              <select value={editForm.gender} onChange={(e) => setEditForm({ ...editForm, gender: e.target.value })} className=\"h-11 rounded-lg border px-3 text-sm bg-white\"><option>Male</option><option>Female</option><option>Other</option></select>\n            </div>\n            <input value={editForm.phone} onChange={(e) => setEditForm({ ...editForm, phone: e.target.value })} placeholder=\"Phone\" className=\"w-full h-11 rounded-lg border px-3 text-sm\" />\n            <div className=\"flex gap-2 pt-1\">\n              <button type=\"button\" onClick={() => setEditId(null)} className=\"flex-1 h-11 rounded-lg border text-sm\">Cancel</button>\n              <button disabled={saving} className=\"flex-1 h-11 rounded-lg bg-[#c2183a] text-white text-sm font-semibold disabled:opacity-50\">{saving ? \"Saving…\" : \"Save\"}</button>\n            </div>\n          </form>\n        </div>\n      )}\n"
              t = t.replace("    </AppShell>\n  );\n}", modal + "    </AppShell>\n  );\n}")
              p.write_text(t)
              print("done")
          EOF
      - name: Commit
        run: |
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add src/app/opd/page.tsx
          git commit -m "feat(ux): OPD serial numbers and demographic edit via PATCH" || exit 0
          git push origin HEAD:main
