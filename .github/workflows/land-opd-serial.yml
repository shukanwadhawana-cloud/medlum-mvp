name: land-opd-serial
on:
  workflow_dispatch:
jobs:
  land:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Serial numbers
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('src/app/opd/page.tsx')
          t = p.read_text()
          if 'idx + 1' in t:
              print('already')
          else:
              t = t.replace('{filtered.map((p) => (', '{filtered.map((p, idx) => (')
              t = t.replace('<p className=\"truncate text-sm font-semibold\">{p.name}</p>', '<p className=\"truncate text-sm font-semibold\"><span className=\"text-gray-400 font-normal mr-2\">{idx + 1}.</span>{p.name}</p>')
              p.write_text(t)
              print('done')
          "
      - name: Commit
        run: |
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add src/app/opd/page.tsx
          git commit -m "feat(ux): OPD worklist serial numbers" || exit 0
          git push origin HEAD:main
