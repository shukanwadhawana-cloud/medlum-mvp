name: apply-ux-batch
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 20
      - name: Restore patients page and apply UX fixes
        run: |
          set -euo pipefail
          # Restore patients page if corrupted
          if ! grep -q 'export default function PatientsPage' src/app/patients/page.tsx; then
            git show 4919d5dc546c9e6ae8c16b167096e5c1a686bf39:src/app/patients/page.tsx > src/app/patients/page.tsx
          fi
          python3 << 'PY'
          from pathlib import Path
          import re

          # patients table mobile
          p = Path('src/app/patients/page.tsx')
          t = p.read_text()
          t = t.replace(
              '<div className="bg-white rounded-xl shadow-sm border overflow-x-auto">\n          <table className="min-w-full text-left text-xs">',
              '<div className="bg-white rounded-xl shadow-sm border overflow-x-auto -mx-1 px-1">\n          <p className="sm:hidden px-2 pt-2 text-[10px] text-gray-400">Swipe sideways to see all columns</p>\n          <table className="min-w-[920px] w-full text-left text-xs whitespace-nowrap">'
          )
          for label in ['S.No','Patient ID','Patient Name','Age / Gender','Setting','Date of Admission','LOS','Ward / Bed','Specialty','Action']:
              t = t.replace(f'<th className="px-2 py-2 font-semibold">{label}</th>', f'<th className="px-2 py-2 font-semibold whitespace-nowrap">{label}</th>')
          t = t.replace('<td className="px-2 py-2 text-gray-500">{i + 1}</td>', '<td className="px-2 py-2 text-gray-500 whitespace-nowrap">{i + 1}</td>')
          t = t.replace('<td className="px-2 py-2 font-mono text-[11px]">{p.uhid || p.registrationNo || p.medlumId || p.id.slice(0, 8)}</td>', '<td className="px-2 py-2 font-mono text-[11px] whitespace-nowrap">{p.uhid || p.registrationNo || p.medlumId || p.id.slice(0, 8)}</td>')
          t = t.replace('<td className="px-2 py-2 font-semibold text-sm">{p.name}</td>', '<td className="px-2 py-2 font-semibold text-sm whitespace-nowrap max-w-[180px] truncate">{p.name}</td>')
          t = t.replace('<td className="px-2 py-2">{p.age} / {p.gender}</td>', '<td className="px-2 py-2 whitespace-nowrap">{p.age} / {p.gender}</td>')
          p.write_text(t)
          print('patients ok')

          # ipd census table
          p = Path('src/app/ipd/page.tsx')
          t = p.read_text()
          t = t.replace(
              '<div className="bg-white rounded-xl border shadow-sm overflow-x-auto">\n          <table className="min-w-full text-left text-xs">',
              '<div className="bg-white rounded-xl border shadow-sm overflow-x-auto">\n          <p className="sm:hidden px-2 pt-2 text-[10px] text-gray-400">Swipe sideways to see all columns</p>\n          <table className="min-w-[920px] w-full text-left text-xs whitespace-nowrap">'
          )
          for label in ['S.No','Patient ID','Patient Name','Age/Gender','Date of Admission','LOS','Ward Location','Room / Bed','Specialty','Action']:
              t = t.replace(f'<th className="px-2 py-2">{label}</th>', f'<th className="px-2 py-2 whitespace-nowrap">{label}</th>')
          p.write_text(t)
          print('ipd census ok')

          # emergency triage colors
          p = Path('src/app/emergency/page.tsx')
          t = p.read_text()
          if 'function triageClass' not in t:
              t = t.replace(
                  'const statuses=["Open","In Treatment","Observation","Admitted","Discharged","Transferred"],triage=["Resuscitation","Emergency","Urgent","Less Urgent","Non-Urgent"],arrivalModes=["Ambulance","Walk-in","Referral"];',
                  'const statuses=["Open","In Treatment","Observation","Admitted","Discharged","Transferred"],triage=["Resuscitation","Emergency","Urgent","Less Urgent","Non-Urgent"],arrivalModes=["Ambulance","Walk-in","Referral"];\nfunction triageClass(level:string){if(level==="Resuscitation")return "bg-red-600 text-white border-red-700";if(level==="Emergency")return "bg-orange-500 text-white border-orange-600";if(level==="Urgent")return "bg-amber-400 text-[#140a1f] border-amber-500";if(level==="Less Urgent")return "bg-green-500 text-white border-green-600";if(level==="Non-Urgent")return "bg-slate-700 text-white border-slate-800";return "bg-gray-100 text-gray-700 border-gray-200";}\n'
              )
              t = t.replace(
                  'c.triageLevel==="Resuscitation"?"bg-red-100 text-red-700":"bg-gray-100"}`}>{c.triageLevel}</div>',
                  '")+triageClass(c.triageLevel)}`}>{c.triageLevel==="Resuscitation"?"T1 · Resuscitation":c.triageLevel==="Emergency"?"T2 · Emergency":c.triageLevel==="Urgent"?"T3 · Urgent":c.triageLevel==="Less Urgent"?"T4 · Less Urgent":"T5 · Non-Urgent"}</div>'
              )
              t = t.replace(
                  '<select value={c.triageLevel} onChange={e=>update(c.id,{triageLevel:e.target.value})} className="h-9 border rounded-lg px-2 text-xs">{triage.map(s=><option key={s}>{s}</option>)}</select>',
                  '<select value={c.triageLevel} onChange={e=>update(c.id,{triageLevel:e.target.value})} className={`h-9 border rounded-lg px-2 text-xs font-semibold ${triageClass(c.triageLevel)}`}>{triage.map(s=><option key={s} value={s}>{s==="Resuscitation"?"T1 · Resuscitation (Red)":s==="Emergency"?"T2 · Emergency (Orange)":s==="Urgent"?"T3 · Urgent (Yellow)":s==="Less Urgent"?"T4 · Less Urgent (Green)":"T5 · Non-Urgent (Black)"}</option>)}</select>'
              )
          p.write_text(t)
          print('emergency ok')
          PY
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add -A
          git commit -m "fix(ux): mobile table scroll, emergency triage colors" || true
          git push origin HEAD:main
