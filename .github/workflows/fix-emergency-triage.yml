name: fix-emergency-triage
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch with python
        run: |
          set -euo pipefail
          python3 <<'EOF'
          from pathlib import Path
          p = Path("src/app/emergency/page.tsx")
          t = p.read_text()
          bad = "${" + '"' + ")+triageClass"
          good = "${" + "triageClass"
          print("bad count", t.count(bad))
          if bad not in t:
              raise SystemExit("pattern not found")
          p.write_text(t.replace(bad, good))
          print("ok")
          EOF
      - name: Commit
        run: |
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add src/app/emergency/page.tsx
          git commit -m "fix(build): repair emergency triageClass so Vercel build passes" || exit 0
          git push origin HEAD:main
