name: Prisma DB Push (DISABLED)

# Intentionally disabled. Production schema changes must use:
#   .github/workflows/prisma-migrate-deploy.yml
# which runs `prisma migrate deploy` only.
# `prisma db push` is not safe for production MedLum data.

on:
  workflow_dispatch:

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse prisma db push
        run: |
          echo "This workflow is disabled. Use 'Prisma Migrate Deploy (Production)' instead."
          exit 1
