name: Restore IPD MLC fields
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply P2-02 Transfer IPD patient label
        run: |
          set -euo pipefail
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/app/ipd/[id]/page.tsx")
          t = p.read_text()
          old = '<h3 className="font-semibold">Transfer bed</h3>'
          new = '<h3 className="font-semibold">Transfer IPD patient</h3>'
          if old not in t:
              if "Transfer IPD patient" in t and "Transfer bed" in t:
                  print("already applied")
                  raise SystemExit(0)
              raise SystemExit("Transfer bed heading not found")
          p.write_text(t.replace(old, new, 1))
          assert "Transfer IPD patient" in p.read_text()
          assert "Transfer bed" in p.read_text()
          print("P2-02 transfer label applied")
          PY
          git add "src/app/ipd/[id]/page.tsx"
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(ci): P2-02 transfer modal title Transfer IPD patient"
          git push origin HEAD:main
