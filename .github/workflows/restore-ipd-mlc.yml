name: Restore IPD MLC fields
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore IPD page from good commit and apply MLC fields
        run: |
          set -euo pipefail
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          GOOD=f9b7a5f50a86b56e04fa6db04b5c0c5ccaecea65
          git show "$GOOD:src/app/ipd/[id]/page.tsx" > /tmp/ipd_good.tsx
          python3 << 'PY'
          from pathlib import Path
          t = Path("/tmp/ipd_good.tsx").read_text()
          old = '''    <input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="Phone" className="h-9 px-2 rounded-lg border"/>\n    <input value={form.allergies} onChange={e=>setForm({...form,allergies:e.target.value})} placeholder="Allergies" className="h-9 px-2 rounded-lg border col-span-2"/>\n    <select value={form.wardType}'''
          new = '''    <input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="Phone" className="h-9 px-2 rounded-lg border"/>\n    <input value={form.address} onChange={e=>setForm({...form,address:e.target.value})} placeholder="Address" className="h-9 px-2 rounded-lg border col-span-2"/>\n    <select value={form.idType} onChange={e=>setForm({...form,idType:e.target.value})} className="h-9 px-2 rounded-lg border"><option>Aadhaar</option><option>PAN</option><option>Passport</option><option>Other</option></select>\n    <input value={form.idNumber} onChange={e=>setForm({...form,idNumber:e.target.value})} placeholder="ID number" className="h-9 px-2 rounded-lg border"/>\n    <input value={form.mlcNumber} onChange={e=>setForm({...form,mlcNumber:e.target.value})} placeholder="MLC number (if applicable)" className="h-9 px-2 rounded-lg border"/>\n    <input value={form.prdNumber} onChange={e=>setForm({...form,prdNumber:e.target.value})} placeholder="PRD number" className="h-9 px-2 rounded-lg border"/>\n    <input value={form.allergies} onChange={e=>setForm({...form,allergies:e.target.value})} placeholder="Allergies" className="h-9 px-2 rounded-lg border col-span-2"/>\n    <select value={form.wardType}'''
          if old not in t:
              raise SystemExit("pattern not found in good commit file")
          fixed = t.replace(old, new, 1)
          Path("src/app/ipd/[id]/page.tsx").write_text(fixed)
          assert "MLC number (if applicable)" in fixed
          assert "use client" in fixed
          print("ready", len(fixed))
          PY
          git add "src/app/ipd/[id]/page.tsx"
          git status
          git commit -m "fix(ci): restore full IPD CPRS page with MLC/PRD/address/ID registration fields"
          git push origin HEAD:main
