name: land-ux-remaining
on:
  workflow_dispatch:
jobs:
  land:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply remaining UX
        run: |
          set -euo pipefail
          python3 << 'EOF'
          from pathlib import Path
          import re

          # OPD: remove Recent OPD encounters section
          p = Path("src/app/opd/page.tsx")
          t = p.read_text()
          t2, n = re.subn(
              r'\s*<section className="mb-4 overflow-hidden rounded-2xl border bg-white">\s*<div className="border-b px-4 py-3 font-semibold">Recent OPD encounters</div>.*?</section>',
              "\n      {/* Recent encounters: use patient chart / UHID search */}",
              t,
              count=1,
              flags=re.S,
          )
          print("opd encounters removed", n)
          if n:
              t = t2
          # OPD serial + edit button if still flat list
          if "editId" not in t:
              t = t.replace(
                  '  const [form, setForm] = useState({ name: "", age: "", gender: "Male", phone: "" });',
                  '  const [form, setForm] = useState({ name: "", age: "", gender: "Male", phone: "" });\n  const [editId, setEditId] = useState<string | null>(null);\n  const [editForm, setEditForm] = useState({ name: "", age: "", gender: "Male", phone: "" });',
              )
              insert = '''  async function saveEdit(e: React.FormEvent) {
    e.preventDefault();
    if (!editId) return;
    setSaving(true); setErr(""); setMsg("");
    try {
      const r = await fetch(`/api/patients/${editId}`, { method: "PATCH", credentials: "include", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: editForm.name.trim(), age: Number(editForm.age) || 0, gender: editForm.gender, phone: editForm.phone.trim() }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Could not update patient");
      setMsg("Patient details updated."); setEditId(null); await reload();
    } catch (e) { setErr(e instanceof Error ? e.message : "Could not update patient"); }
    finally { setSaving(false); }
  }

'''
              t = t.replace("  const filtered = useMemo(() => {", insert + "  const filtered = useMemo(() => {")
              t = t.replace("{filtered.map((p) => (", "{filtered.map((p, idx) => (")
              t = t.replace(
                  '<p className="mt-1 text-[10px] text-gray-400">ID {p.id}</p>',
                  '<p className="mt-1 text-[10px] text-gray-400">{p.uhid || p.registrationNo || `ID ${p.id.slice(0, 8)}`}</p>',
              )
              t = t.replace(
                  '<div className="min-w-0">\n                  <p className="truncate text-sm font-semibold">{p.name}</p>',
                  '<div className="min-w-0 flex gap-3">\n                  <span className="shrink-0 w-6 text-center text-xs font-semibold text-gray-400 pt-0.5">{idx + 1}</span>\n                  <div className="min-w-0">\n                  <p className="truncate text-sm font-semibold">{p.name}</p>',
              )
              # close extra div after id line block - careful
              t = t.replace(
                  '<Link href={`/patients/${p.id}`} className="flex h-9 items-center justify-center rounded-lg bg-[#c2183a] px-3 text-xs font-semibold text-white">Open OPD visit</Link>\n                  <Link href="/billing" className="text-center text-[11px] font-medium text-[#c2183a]">Bill</Link>',
                  '<Link href={`/patients/${p.id}`} className="flex h-9 items-center justify-center rounded-lg bg-[#c2183a] px-3 text-xs font-semibold text-white">Open OPD visit</Link>\n                  <button type="button" onClick={() => { setEditId(p.id); setEditForm({ name: p.name, age: String(p.age || ""), gender: p.gender || "Male", phone: p.phone || "" }); }} className="h-8 rounded-lg border px-3 text-[11px] font-medium">Edit</button>\n                  <Link href="/billing" className="text-center text-[11px] font-medium text-[#c2183a]">Bill</Link>',
              )
              if "editId &&" not in t:
                  t = t.replace(
                      "    </AppShell>\n  );\n}",
                      '''      {editId && (
        <div className="fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center p-3">
          <form onSubmit={saveEdit} className="bg-white rounded-2xl w-full max-w-md p-4 shadow-xl space-y-2">
            <h3 className="text-base font-semibold">Edit patient details</h3>
            <input required value={editForm.name} onChange={(e) => setEditForm({ ...editForm, name: e.target.value })} placeholder="Full name" className="w-full h-11 rounded-lg border px-3 text-sm" />
            <div className="grid grid-cols-2 gap-2">
              <input required value={editForm.age} onChange={(e) => setEditForm({ ...editForm, age: e.target.value })} placeholder="Age" inputMode="numeric" className="h-11 rounded-lg border px-3 text-sm" />
              <select value={editForm.gender} onChange={(e) => setEditForm({ ...editForm, gender: e.target.value })} className="h-11 rounded-lg border px-3 text-sm bg-white"><option>Male</option><option>Female</option><option>Other</option></select>
            </div>
            <input value={editForm.phone} onChange={(e) => setEditForm({ ...editForm, phone: e.target.value })} placeholder="Phone" className="w-full h-11 rounded-lg border px-3 text-sm" />
            <div className="flex gap-2 pt-1">
              <button type="button" onClick={() => setEditId(null)} className="flex-1 h-11 rounded-lg border text-sm">Cancel</button>
              <button disabled={saving} className="flex-1 h-11 rounded-lg bg-[#c2183a] text-white text-sm font-semibold disabled:opacity-50">{saving ? "Saving…" : "Save"}</button>
            </div>
          </form>
        </div>
      )}
    </AppShell>
  );
}''',
                  )
          p.write_text(t)
          print("opd done")

          # VIDEO: hide completed by default
          p = Path("src/app/telemedicine/page.tsx")
          t = p.read_text()
          if "showCompleted" not in t:
              t = t.replace(
                  '  const [warning, setWarning] = useState("");',
                  '  const [warning, setWarning] = useState("");\n  const [showCompleted, setShowCompleted] = useState(false);',
              )
          if "Show completed / cancelled" not in t and "sessions.map((s) =>" in t:
              # Replace sessions.map header to filter
              t = t.replace(
                  '<div className="border-b px-4 py-3 font-semibold">Video sessions</div>',
                  '''<div className="border-b px-4 py-3 flex flex-wrap items-center justify-between gap-2">
          <div className="font-semibold">Video sessions</div>
          <label className="inline-flex items-center gap-1.5 text-[11px] text-gray-600 cursor-pointer">
            <input type="checkbox" checked={showCompleted} onChange={(e) => setShowCompleted(e.target.checked)} />
            Show completed / cancelled
          </label>
        </div>
        <div className="px-4 py-2 text-[11px] text-gray-500 border-b bg-slate-50">
          Telemedicine is billable. Duration from startedAt/endedAt when set. Typical consult 5+ min; no hard cutoff.
        </div>''',
              )
              t = t.replace(
                  "sessions.map((s) => {",
                  "sessions.filter((s) => { const done = [\"Completed\", \"Cancelled\", \"Expired\"].includes(String(s.status || \"\")); return showCompleted ? true : !done; }).map((s, idx) => {",
              )
              t = t.replace(
                  '<div className="font-medium">{title}</div>',
                  '<div className="font-medium"><span className="text-gray-400 text-xs mr-2">{idx + 1}.</span>{title}</div>',
              )
          p.write_text(t)
          print("video done")

          # IPD cover enrichment
          p = Path("src/app/ipd/[id]/page.tsx")
          t = p.read_text()
          if "Cover Sheet · Current Clinical Snapshot" not in t:
              old_snip = "Patient record & notes live inside the clinical workspace"
              if old_snip in t:
                  t = t.replace(
                      old_snip,
                      "Notes, orders, MAR and discharge live in the clinical workspace",
                  )
              # Insert clinical context block before Open Clinical Workspace if missing
              needle = '<div className="mt-4 flex flex-wrap gap-2"><Link href={`/ipd/${selected.id}/clinical`}'
              if needle in t and "Latest clinical context" not in t:
                  insert = '''<div className="mt-3 grid md:grid-cols-2 gap-3 text-xs"><div className="rounded-lg border bg-slate-50/60 p-3"><p className="text-[10px] font-semibold text-gray-500 uppercase">Latest clinical context</p><p className="mt-1"><span className="text-gray-500">Complaint:</span> {selected.chiefComplaint||"—"}</p><p className="mt-0.5"><span className="text-gray-500">Diagnosis:</span> {selected.diagnosis||selected.workingDiagnosis||"—"}</p></div><div className="rounded-lg border bg-slate-50/60 p-3"><p className="text-[10px] font-semibold text-gray-500 uppercase">Location</p><p className="mt-1">{selected.wardType||"Ward"} · Bed {selected.roomNumber||"—"}</p><p className="mt-0.5 text-gray-500">Department: {selected.department||"—"}</p></div></div>'''
                  t = t.replace(needle, insert + needle)
              p.write_text(t)
              print("ipd done")
          else:
              print("ipd already")

          print("ALL_OK")
          EOF
      - name: Commit and push
        run: |
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add -A
          git status --short
          git commit -m "feat(ux): OPD serial/edit + remove recent encounters, video archive, IPD context" || exit 0
          git push origin HEAD:main
