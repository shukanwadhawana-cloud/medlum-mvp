name: MedLum CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
          SESSION_SECRET: ci-build-secret-not-used-in-production
        run: npm run build
