name: land-ux-simple
on:
  workflow_dispatch:
jobs:
  land:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove Recent OPD encounters
        run: |
          set -euo pipefail
          python3 -c "
          from pathlib import Path
          import re
          p = Path('src/app/opd/page.tsx')
          t = p.read_text()
          t2, n = re.subn(r'<section className=\"mb-4 overflow-hidden rounded-2xl border bg-white\">\\s*<div className=\"border-b px-4 py-3 font-semibold\">Recent OPD encounters</div>.*?</section>', '<!-- recent encounters removed -->', t, count=1, flags=re.S)
          print('removed', n)
          p.write_text(t2 if n else t)
          "
      - name: Commit
        run: |
          git config user.name "MedLum CI Bot"
          git config user.email "ci-bot@medlum.local"
          git add src/app/opd/page.tsx
          git commit -m "feat(ux): remove Recent OPD encounters from default OPD worklist" || exit 0
          git push origin HEAD:main
